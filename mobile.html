<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ARGO - 우리 가족 가치관 나침반 (모바일 앱)</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F59E0B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Pretendard Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <!-- 50개 심층 질문 & 6대 영역 데이터베이스 로드 -->
  <script src="questions-data.js"></script>

  <style>
    body {
      background-color: #F3F4F6;
      font-family: 'Pretendard', sans-serif;
      color: #1F2937;
      word-break: keep-all;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .mobile-screen {
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      background-color: #FDFBF7;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom, 20px);
    }
    .custom-scroll::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    const FAMILY_MEMBERS = [
      { id: 'father', name: '아빠', age: 45, role: '휴직 중 (삶의 2막)', avatar: '🐻', badge: '쉼과 새로운 도약' },
      { id: 'mother', name: '엄마', age: 43, role: '이번 주 퇴직', avatar: '🦊', badge: '정체성의 확장' },
      { id: 'son', name: '아들', age: 12, role: '초등 5~6학년', avatar: '🐿️', badge: '호기심 모험가' },
      { id: 'daughter', name: '딸', age: 12, role: '초등 5~6학년', avatar: '🐰', badge: '창의적 예술가' }
    ];

    function MobileApp() {
      const [currentTab, setCurrentTab] = useState('home');
      const [courseCount, setCourseCount] = useState(50);

      const activeQuestions = useMemo(() => {
        if (courseCount === 10) {
          const sample = [];
          for (let i = 0; i < 5; i++) {
            sample.push(FIFTY_DILEMMAS[i * 10]);
            sample.push(FIFTY_DILEMMAS[i * 10 + 4]);
          }
          return sample;
        } else if (courseCount === 25) {
          const sample = [];
          for (let i = 0; i < 5; i++) {
            for (let j = 0; j < 5; j++) {
              sample.push(FIFTY_DILEMMAS[i * 10 + j]);
            }
          }
          return sample;
        }
        return FIFTY_DILEMMAS;
      }, [courseCount]);

      // 솔로 모드 상태
      const [soloMember, setSoloMember] = useState(FAMILY_MEMBERS[0]);
      const [soloStep, setSoloStep] = useState(0);
      const [soloScores, setSoloScores] = useState({});
      const [soloHistory, setSoloHistory] = useState([]); // [{ step, valueKey }]
      const [soloFinished, setSoloFinished] = useState(false);
      const [activeRecoTab, setActiveRecoTab] = useState('career');

      // 패밀리 릴레이 모드 상태
      const [familyRound, setFamilyRound] = useState(0);
      const [familyTurn, setFamilyTurn] = useState(0);
      const [familyScores, setFamilyScores] = useState({ father: {}, mother: {}, son: {}, daughter: {} });
      const [familyHistory, setFamilyHistory] = useState([]); // [{ round, turn, memberId, valueKey }]
      const [familyFinished, setFamilyFinished] = useState(false);
      const [showPassModal, setShowPassModal] = useState(false);

      // 오늘의 가치 질문 한 입
      const [dailyBiteIndex, setDailyBiteIndex] = useState(0);
      const dailyQuestions = [
        "오늘 하루 중 가장 가슴이 편안했던 순간은 언제였나요?",
        "10년 뒤 오늘, 내가 가장 자랑스러워하고 싶은 나의 모습은?",
        "오늘 가족 중 한 명에게 해주고 싶은 고마운 말 한마디는?",
        "어릴 때 시간 가는 줄 모르고 놀았던 놀이는 무엇이었나요?"
      ];

      // 최다 득표 가치
      const getTopValue = (scores) => {
        const entries = Object.entries(scores);
        if (entries.length === 0) return 'autonomy';
        entries.sort((a, b) => b[1] - a[1]);
        return entries[0][0];
      };

      // 솔로 선택
      const handleSoloChoice = (valueKey) => {
        const nextScores = { ...soloScores, [valueKey]: (soloScores[valueKey] || 0) + 1 };
        setSoloScores(nextScores);
        setSoloHistory([...soloHistory, { step: soloStep, valueKey }]);

        if (soloStep + 1 < activeQuestions.length) {
          setSoloStep(soloStep + 1);
        } else {
          setSoloFinished(true);
          if (window.confetti) window.confetti({ particleCount: 80, spread: 70 });
        }
      };

      // 솔로 이전 질문 되돌리기
      const handleSoloPrev = () => {
        if (soloStep === 0 || soloHistory.length === 0) return;
        const lastEntry = soloHistory[soloHistory.length - 1];
        const updatedHistory = soloHistory.slice(0, -1);

        const prevKey = lastEntry.valueKey;
        const updatedScores = { ...soloScores };
        if (updatedScores[prevKey] > 0) {
          updatedScores[prevKey] -= 1;
        }

        setSoloScores(updatedScores);
        setSoloHistory(updatedHistory);
        setSoloStep(soloStep - 1);
      };

      // 패밀리 릴레이 선택
      const handleFamilyChoice = (valueKey) => {
        const currentM = FAMILY_MEMBERS[familyTurn];
        const mScore = familyScores[currentM.id] || {};
        const updatedScore = { ...mScore, [valueKey]: (mScore[valueKey] || 0) + 1 };
        setFamilyScores({ ...familyScores, [currentM.id]: updatedScore });

        // 히스토리 추가
        setFamilyHistory([...familyHistory, {
          round: familyRound,
          turn: familyTurn,
          memberId: currentM.id,
          valueKey
        }]);

        if (familyTurn + 1 < FAMILY_MEMBERS.length) {
          setFamilyTurn(familyTurn + 1);
          setShowPassModal(true);
        } else {
          if (familyRound + 1 < activeQuestions.length) {
            setFamilyRound(familyRound + 1);
            setFamilyTurn(0);
            setShowPassModal(true);
          } else {
            setFamilyFinished(true);
            if (window.confetti) window.confetti({ particleCount: 100, spread: 80 });
          }
        }
      };

      // 패밀리 릴레이 이전 턴 되돌리기
      const handleFamilyPrev = () => {
        if (familyHistory.length === 0) return;
        const lastEntry = familyHistory[familyHistory.length - 1];
        const updatedHistory = familyHistory.slice(0, -1);

        const { memberId, valueKey, round, turn } = lastEntry;
        const mScore = { ...familyScores[memberId] };
        if (mScore[valueKey] > 0) {
          mScore[valueKey] -= 1;
        }
        setFamilyScores({ ...familyScores, [memberId]: mScore });

        setFamilyHistory(updatedHistory);
        setFamilyRound(round);
        setFamilyTurn(turn);
      };

      return (
        <div className="mobile-screen">
          {/* 상단 모바일 앱 헤더 */}
          <header className="px-5 py-4 bg-white/95 backdrop-blur-md sticky top-0 z-30 border-b border-gray-100 flex items-center justify-between shadow-xs">
            <div className="flex items-center gap-2" onClick={() => setCurrentTab('home')}>
              <span className="text-2xl">🧭</span>
              <div>
                <span className="font-black text-xl text-gray-900 tracking-tight">ARGO</span>
                <span className="ml-1 text-xs font-bold px-2 py-0.5 bg-amber-100 text-amber-800 rounded-full">50문항 나침반</span>
              </div>
            </div>
            <div className="text-xs font-extrabold text-amber-600 bg-amber-50 px-2.5 py-1 rounded-lg border border-amber-200">
              {courseCount}문항 코스
            </div>
          </header>

          {/* 메인 스크롤 영역 */}
          <main className="flex-1 overflow-y-auto px-5 py-6 custom-scroll pb-28">

            {/* -------------------- [TAB 1: HOME] -------------------- */}
            {currentTab === 'home' && (
              <div className="space-y-6">
                <div className="bg-gradient-to-br from-amber-400 via-amber-500 to-orange-500 text-white rounded-3xl p-6 shadow-md">
                  <span className="text-xs font-black uppercase tracking-wider bg-white/20 px-3 py-1 rounded-full">
                    50 DEEP DILEMMAS & 6 DIMENSIONS
                  </span>
                  <h1 className="text-2xl font-black mt-3 mb-2 leading-tight">
                    진짜 내 마음의 가치를 찾는 <br/>50개 심층 인생 항해
                  </h1>
                  <p className="text-xs text-amber-50 leading-relaxed">
                    아빠의 쉼, 엄마의 새출발, 아이들의 무한한 성장! <br/>
                    <strong>직업·공부·취미·놀이·여행지·생활활동</strong> 6대 영역을 찾아요.
                  </p>
                </div>

                {/* 오늘의 생각 한 입 */}
                <div className="bg-white border-2 border-amber-200 rounded-2xl p-4 shadow-xs">
                  <div className="flex items-center justify-between mb-1.5">
                    <span className="text-xs font-black text-amber-600 flex items-center gap-1">
                      <span>💡</span> 오늘의 생각 한 입
                    </span>
                    <button 
                      onClick={() => setDailyBiteIndex((dailyBiteIndex + 1) % dailyQuestions.length)}
                      className="text-xs font-bold text-gray-400"
                    >
                      다른 질문 ↻
                    </button>
                  </div>
                  <p className="text-base font-bold text-gray-800 leading-snug">
                    "{dailyQuestions[dailyBiteIndex]}"
                  </p>
                </div>

                {/* 질문 분량 선택 */}
                <div className="bg-white border border-gray-200 rounded-2xl p-4 shadow-xs">
                  <div className="text-xs font-black text-gray-500 mb-2">질문 코스 선택</div>
                  <div className="grid grid-cols-3 gap-2">
                    {[
                      { count: 10, label: '10문항', desc: '5분 숏코스' },
                      { count: 25, label: '25문항', desc: '15분 심층' },
                      { count: 50, label: '50문항', desc: '완전 마스터' }
                    ].map(c => (
                      <button
                        key={c.count}
                        onClick={() => setCourseCount(c.count)}
                        className={`py-2 px-2 rounded-xl text-center border-2 transition-all ${
                          courseCount === c.count ? 'border-amber-500 bg-amber-50 text-amber-900 font-black' : 'border-gray-200 text-gray-500 font-bold'
                        }`}
                      >
                        <div className="text-sm">{c.label}</div>
                        <div className="text-[10px] opacity-75">{c.desc}</div>
                      </button>
                    ))}
                  </div>
                </div>

                {/* 4인 프로필 */}
                <div>
                  <h2 className="text-xs font-bold text-gray-400 mb-2 px-1">우리 가족 4인 프로필</h2>
                  <div className="grid grid-cols-2 gap-2.5">
                    {FAMILY_MEMBERS.map(m => (
                      <div key={m.id} className="bg-white border border-gray-200 rounded-2xl p-3 flex items-center gap-2.5 shadow-xs">
                        <span className="text-2xl">{m.avatar}</span>
                        <div>
                          <div className="font-black text-sm text-gray-900">{m.name} <span className="text-xs text-gray-400 font-normal">({m.age}세)</span></div>
                          <div className="text-[11px] font-bold text-amber-700">{m.badge}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* 모드 실행 버튼 2개 */}
                <div className="space-y-3 pt-1">
                  <button
                    onClick={() => { setCurrentTab('solo'); setSoloFinished(false); setSoloStep(0); setSoloScores({}); setSoloHistory([]); }}
                    className="w-full text-left p-4 bg-white border-2 border-amber-300 active:border-amber-500 rounded-2xl shadow-xs flex items-center justify-between"
                  >
                    <div className="flex items-center gap-3">
                      <div className="w-12 h-12 rounded-xl bg-amber-100 flex items-center justify-center text-2xl shrink-0">
                        🧘
                      </div>
                      <div>
                        <span className="text-[11px] font-black text-amber-700">모드 1. 혼자 깊이 생각하기</span>
                        <div className="text-lg font-black text-gray-900">솔로 심층 모드 ({courseCount}문항)</div>
                        <div className="text-[11px] text-gray-500 mt-0.5">언제든 이전 질문으로 되돌아갈 수 있어요</div>
                      </div>
                    </div>
                    <span className="text-lg text-amber-500 font-bold">➜</span>
                  </button>

                  <button
                    onClick={() => { setCurrentTab('family'); setFamilyFinished(false); setFamilyRound(0); setFamilyTurn(0); setFamilyScores({ father: {}, mother: {}, son: {}, daughter: {} }); setFamilyHistory([]); }}
                    className="w-full text-left p-4 bg-white border-2 border-indigo-300 active:border-indigo-500 rounded-2xl shadow-xs flex items-center justify-between"
                  >
                    <div className="flex items-center gap-3">
                      <div className="w-12 h-12 rounded-xl bg-indigo-100 flex items-center justify-center text-2xl shrink-0">
                        👨‍👩‍👧‍👦
                      </div>
                      <div>
                        <span className="text-[11px] font-black text-indigo-700">모드 2. 폰 넘겨가며 대화하기</span>
                        <div className="text-lg font-black text-gray-900">패밀리 릴레이 모드 ({courseCount}문항)</div>
                        <div className="text-[11px] text-gray-500 mt-0.5">실수했을 때 이전 턴으로 되돌아가기 지원</div>
                      </div>
                    </div>
                    <span className="text-lg text-indigo-500 font-bold">➜</span>
                  </button>
                </div>
              </div>
            )}

            {/* -------------------- [TAB 2: SOLO MODE] -------------------- */}
            {currentTab === 'solo' && (
              <div>
                {!soloFinished ? (
                  <div className="space-y-4">
                    {/* 상단 멤버 선택 */}
                    <div className="flex gap-2 overflow-x-auto pb-1 custom-scroll">
                      {FAMILY_MEMBERS.map(m => (
                        <button
                          key={m.id}
                          onClick={() => { setSoloMember(m); setSoloStep(0); setSoloScores({}); setSoloHistory([]); }}
                          className={`px-3 py-1.5 rounded-full text-xs font-black flex items-center gap-1 shrink-0 ${
                            soloMember.id === m.id ? 'bg-amber-500 text-white shadow-xs' : 'bg-white border border-gray-200 text-gray-600'
                          }`}
                        >
                          <span>{m.avatar}</span>
                          <span>{m.name}</span>
                        </button>
                      ))}
                    </div>

                    {/* 진행률 바 & 이전 질문 버튼 */}
                    <div className="flex items-center justify-between text-xs font-bold text-gray-400">
                      <div className="flex items-center gap-2">
                        <span>{soloMember.name}의 가치관</span>
                        {soloStep > 0 && (
                          <button
                            onClick={handleSoloPrev}
                            className="text-amber-700 bg-amber-100 px-2 py-0.5 rounded-md font-black flex items-center gap-0.5 active:bg-amber-200"
                          >
                            <span>↺ 이전 질문</span>
                          </button>
                        )}
                      </div>
                      <span className="text-amber-600 font-black">{soloStep + 1} / {activeQuestions.length}</span>
                    </div>
                    <div className="w-full h-2 bg-gray-200 rounded-full overflow-hidden">
                      <div 
                        className="h-full bg-amber-500 transition-all duration-300"
                        style={{ width: `${((soloStep + 1) / activeQuestions.length) * 100}%` }}
                      ></div>
                    </div>

                    {/* 1문항 1스크린 대형 질문 카드 */}
                    <div className="bg-white border border-gray-200 rounded-3xl p-5 shadow-xs">
                      <div className="flex items-center justify-between mb-1">
                        <span className="text-xs font-black text-amber-600 uppercase">
                          Q{soloStep + 1}. {activeQuestions[soloStep].title}
                        </span>
                        {soloStep > 0 && (
                          <button
                            onClick={handleSoloPrev}
                            className="text-[11px] text-gray-400 hover:text-amber-700 font-bold"
                          >
                            ↺ 이전 질문으로 돌아가기
                          </button>
                        )}
                      </div>

                      <h3 className="text-lg font-black text-gray-900 mt-1 mb-5 leading-snug">
                        {activeQuestions[soloStep].question}
                      </h3>

                      {/* 선택지 2개 */}
                      <div className="space-y-3">
                        <button
                          onClick={() => handleSoloChoice(activeQuestions[soloStep].optionA.valueKey)}
                          className="w-full text-left p-4 bg-amber-50/70 active:bg-amber-100 border-2 border-amber-200 rounded-2xl flex items-start gap-3"
                        >
                          <span className="text-3xl shrink-0">{activeQuestions[soloStep].optionA.emoji}</span>
                          <div>
                            <div className="text-base font-black text-gray-900 mb-0.5">
                              {activeQuestions[soloStep].optionA.title}
                            </div>
                            <div className="text-xs text-gray-700 leading-relaxed font-medium">
                              {activeQuestions[soloStep].optionA.desc}
                            </div>
                          </div>
                        </button>

                        <button
                          onClick={() => handleSoloChoice(activeQuestions[soloStep].optionB.valueKey)}
                          className="w-full text-left p-4 bg-indigo-50/70 active:bg-indigo-100 border-2 border-indigo-200 rounded-2xl flex items-start gap-3"
                        >
                          <span className="text-3xl shrink-0">{activeQuestions[soloStep].optionB.emoji}</span>
                          <div>
                            <div className="text-base font-black text-gray-900 mb-0.5">
                              {activeQuestions[soloStep].optionB.title}
                            </div>
                            <div className="text-xs text-gray-700 leading-relaxed font-medium">
                              {activeQuestions[soloStep].optionB.desc}
                            </div>
                          </div>
                        </button>
                      </div>
                    </div>
                  </div>
                ) : (
                  /* 솔로 완료 */
                  <div className="space-y-5">
                    {(() => {
                      const topKey = getTopValue(soloScores);
                      const topData = SIX_DIMENSIONS_RECOMMENDATIONS[topKey] || SIX_DIMENSIONS_RECOMMENDATIONS.autonomy;
                      const isAdult = soloMember.age >= 20;

                      return (
                        <>
                          <div className="bg-gradient-to-r from-amber-500 to-orange-500 text-white rounded-3xl p-6 text-center shadow-md">
                            <span className="text-5xl">{soloMember.avatar}</span>
                            <h2 className="text-2xl font-black mt-2 mb-1">{soloMember.name}의 가치관 나침반</h2>
                            <div className="inline-block px-3 py-1 bg-white/20 rounded-full text-xs font-black mt-1">
                              핵심 닻: {topData.name} ({courseCount}문항 분석)
                            </div>
                          </div>

                          {/* 6대 영역 서브 탭 */}
                          <div>
                            <div className="flex gap-1.5 overflow-x-auto pb-2 custom-scroll">
                              {[
                                { id: 'career', label: '💼 직업' },
                                { id: 'study', label: '📚 공부' },
                                { id: 'hobby', label: '🎨 취미' },
                                { id: 'play', label: '🎲 놀이' },
                                { id: 'travel', label: '🗺️ 여행지' },
                                { id: 'life', label: '☀️ 생활활동' }
                              ].map(t => (
                                <button
                                  key={t.id}
                                  onClick={() => setActiveRecoTab(t.id)}
                                  className={`px-3 py-1.5 rounded-xl text-xs font-black shrink-0 transition-all ${
                                    activeRecoTab === t.id ? 'bg-amber-500 text-white shadow-xs' : 'bg-white border border-gray-200 text-gray-600'
                                  }`}
                                >
                                  {t.label}
                                </button>
                              ))}
                            </div>

                            <div className="bg-white border-2 border-amber-200 rounded-3xl p-5 shadow-xs mt-2">
                              {activeRecoTab === 'career' && (
                                <div>
                                  <span className="text-[11px] font-black text-amber-600">01. 맞춤 직업/역할</span>
                                  <h3 className="text-base font-black text-gray-900 mt-1 mb-2">가치 실현형 커리어 모델</h3>
                                  <div className="p-3 bg-amber-50 rounded-xl border border-amber-200 font-bold text-amber-950 text-sm mb-2 leading-relaxed">
                                    {isAdult ? topData.career.adult : topData.career.child}
                                  </div>
                                  <p className="text-xs text-gray-600 leading-relaxed">
                                    {isAdult ? '생계를 넘어 내 가치관을 온전히 발현할 수 있는 독립적 생계 모델입니다.' : '스스로 퀘스트를 정하고 주도적으로 문제를 해결하는 미래형 인재로 자라납니다.'}
                                  </p>
                                </div>
                              )}

                              {activeRecoTab === 'study' && (
                                <div>
                                  <span className="text-[11px] font-black text-sky-600">02. 의미 있는 공부</span>
                                  <h3 className="text-base font-black text-gray-900 mt-1 mb-2">지적 호기심과 세계의 확장</h3>
                                  <div className="p-3 bg-sky-50 rounded-xl border border-sky-200 font-bold text-sky-950 text-sm mb-2 leading-relaxed">
                                    {topData.study}
                                  </div>
                                  <p className="text-xs text-gray-600 leading-relaxed">
                                    단순 점수가 아닌, 세상을 더 깊고 지혜롭게 바라보는 지적 탐험입니다.
                                  </p>
                                </div>
                              )}

                              {activeRecoTab === 'hobby' && (
                                <div>
                                  <span className="text-[11px] font-black text-emerald-600">03. 몰입(Flow) 취미</span>
                                  <h3 className="text-base font-black text-gray-900 mt-1 mb-2">능동적으로 창조하는 여가</h3>
                                  <div className="p-3 bg-emerald-50 rounded-xl border border-emerald-200 font-bold text-emerald-950 text-sm mb-2 leading-relaxed">
                                    {topData.hobby}
                                  </div>
                                  <p className="text-xs text-gray-600 leading-relaxed">
                                    시간 가는 줄 모르고 손끝과 온몸의 감각을 깨우는 깊은 쉼의 시간입니다.
                                  </p>
                                </div>
                              )}

                              {activeRecoTab === 'play' && (
                                <div>
                                  <span className="text-[11px] font-black text-yellow-700">04. 순수 유희와 놀이 (Play)</span>
                                  <h3 className="text-base font-black text-gray-900 mt-1 mb-2">동심과 생명력을 깨우는 놀이</h3>
                                  <div className="p-3 bg-yellow-50 rounded-xl border border-yellow-200 font-bold text-yellow-950 text-sm mb-2 leading-relaxed">
                                    {topData.play}
                                  </div>
                                  <p className="text-xs text-gray-600 leading-relaxed">
                                    어른에게는 굳은 마음을 녹이는 웃음을, 아이에게는 살아있는 기쁨을 줍니다.
                                  </p>
                                </div>
                              )}

                              {activeRecoTab === 'travel' && (
                                <div>
                                  <span className="text-[11px] font-black text-rose-600">05. 성찰의 여행지</span>
                                  <h3 className="text-base font-black text-gray-900 mt-1 mb-2">내면의 쉼과 전환의 여정</h3>
                                  <div className="p-3 bg-rose-50 rounded-xl border border-rose-200 font-bold text-rose-950 text-sm mb-2 leading-relaxed">
                                    {topData.travel}
                                  </div>
                                  <p className="text-xs text-gray-600 leading-relaxed">
                                    복잡한 관광지를 벗어나 나만의 고요한 영감을 채우는 성찰지입니다.
                                  </p>
                                </div>
                              )}

                              {activeRecoTab === 'life' && (
                                <div>
                                  <span className="text-[11px] font-black text-purple-600">06. 생활 리추얼</span>
                                  <h3 className="text-base font-black text-gray-900 mt-1 mb-2">하루를 받쳐주는 활력 습관</h3>
                                  <div className="p-3 bg-purple-50 rounded-xl border border-purple-200 font-bold text-purple-950 text-sm mb-2 leading-relaxed">
                                    {topData.life}
                                  </div>
                                  <p className="text-xs text-gray-600 leading-relaxed">
                                    매일 아침 심장을 두근거리게 만드는 작은 가치 일치 루틴입니다.
                                  </p>
                                </div>
                              )}
                            </div>
                          </div>

                          <button
                            onClick={() => { setSoloFinished(false); setSoloStep(0); setSoloScores({}); setSoloHistory([]); }}
                            className="w-full py-4 bg-amber-500 active:bg-amber-600 text-white font-black text-base rounded-2xl shadow-xs"
                          >
                            다시 진행하기 / 다른 가족 하기
                          </button>
                        </>
                      );
                    })()}
                  </div>
                )}
              </div>
            )}

            {/* -------------------- [TAB 3: FAMILY RELAY MODE] -------------------- */}
            {currentTab === 'family' && (
              <div>
                {!familyFinished ? (
                  <div className="space-y-4">
                    {/* 상단 턴 안내 배너 & 이전 턴 버튼 */}
                    <div className="bg-indigo-900 text-white rounded-3xl p-5 shadow-xs flex items-center justify-between">
                      <div className="flex items-center gap-3">
                        <span className="text-4xl animate-bounce">{FAMILY_MEMBERS[familyTurn].avatar}</span>
                        <div>
                          <div className="flex items-center gap-1.5">
                            <span className="text-xs font-bold text-indigo-300">
                              Q{familyRound + 1} · {FAMILY_MEMBERS[familyTurn].name}의 턴
                            </span>
                            {familyHistory.length > 0 && (
                              <button
                                onClick={handleFamilyPrev}
                                className="text-[10px] bg-indigo-700 px-1.5 py-0.5 rounded text-amber-300 font-black"
                              >
                                ↺ 이전 턴
                              </button>
                            )}
                          </div>
                          <div className="text-lg font-black text-amber-300">
                            스마트폰을 탭해주세요!
                          </div>
                        </div>
                      </div>
                      <div className="flex gap-1.5">
                        {FAMILY_MEMBERS.map((m, idx) => (
                          <div
                            key={m.id}
                            className={`w-7 h-7 rounded-full flex items-center justify-center text-xs ${
                              idx === familyTurn ? 'bg-amber-400 ring-2 ring-white scale-110' : 'bg-indigo-800 opacity-60'
                            }`}
                          >
                            {m.avatar}
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* 라운드 딜레마 카드 */}
                    <div className="bg-white border border-gray-200 rounded-3xl p-5 shadow-xs">
                      <div className="flex items-center justify-between mb-1">
                        <span className="text-xs font-black text-indigo-600">
                          {activeQuestions[familyRound].title}
                        </span>
                        {familyHistory.length > 0 && (
                          <button
                            onClick={handleFamilyPrev}
                            className="text-[11px] text-gray-400 hover:text-indigo-600 font-bold"
                          >
                            ↺ 이전 가족 턴으로
                          </button>
                        )}
                      </div>

                      <h3 className="text-lg font-black text-gray-900 mt-1 mb-2 leading-snug">
                        {activeQuestions[familyRound].question}
                      </h3>
                      
                      <div className="p-3 bg-indigo-50 rounded-xl text-xs font-bold text-indigo-900 mb-5 leading-relaxed">
                        {activeQuestions[familyRound].familyTopic}
                      </div>

                      {/* 선택지 2개 */}
                      <div className="space-y-3">
                        <button
                          onClick={() => handleFamilyChoice(activeQuestions[familyRound].optionA.valueKey)}
                          className="w-full text-left p-4 bg-amber-50 active:bg-amber-100 border-2 border-amber-200 rounded-2xl"
                        >
                          <div className="text-2xl mb-1">{activeQuestions[familyRound].optionA.emoji}</div>
                          <div className="font-black text-base text-gray-900 mb-0.5">{activeQuestions[familyRound].optionA.title}</div>
                          <div className="text-xs text-gray-700 leading-relaxed">{activeQuestions[familyRound].optionA.desc}</div>
                        </button>

                        <button
                          onClick={() => handleFamilyChoice(activeQuestions[familyRound].optionB.valueKey)}
                          className="w-full text-left p-4 bg-indigo-50 active:bg-indigo-100 border-2 border-indigo-200 rounded-2xl"
                        >
                          <div className="text-2xl mb-1">{activeQuestions[familyRound].optionB.emoji}</div>
                          <div className="font-black text-base text-gray-900 mb-0.5">{activeQuestions[familyRound].optionB.title}</div>
                          <div className="text-xs text-gray-700 leading-relaxed">{activeQuestions[familyRound].optionB.desc}</div>
                        </button>
                      </div>
                    </div>
                  </div>
                ) : (
                  /* 패밀리 완료 */
                  <div className="space-y-5">
                    <div className="bg-gradient-to-r from-indigo-700 via-purple-700 to-pink-600 text-white rounded-3xl p-6 text-center shadow-md">
                      <div className="text-4xl mb-2">🐻 🦊 🐿️ 🐰</div>
                      <h2 className="text-2xl font-black mb-1">온 가족 가치관 지도 완성!</h2>
                      <p className="text-xs text-purple-100">{courseCount}문항 완주 · 서로를 깊이 이해한 소중한 시간</p>
                    </div>

                    <div className="bg-white border border-gray-200 rounded-3xl p-5 shadow-xs space-y-3">
                      <h3 className="font-black text-base text-gray-900">4인 4색 핵심 가치</h3>
                      {FAMILY_MEMBERS.map(m => {
                        const mTopKey = getTopValue(familyScores[m.id]);
                        const mTopData = SIX_DIMENSIONS_RECOMMENDATIONS[mTopKey] || SIX_DIMENSIONS_RECOMMENDATIONS.autonomy;
                        return (
                          <div key={m.id} className="flex items-center justify-between p-3 bg-gray-50 rounded-2xl">
                            <div className="flex items-center gap-2.5">
                              <span className="text-2xl">{m.avatar}</span>
                              <span className="font-bold text-sm text-gray-800">{m.name}</span>
                            </div>
                            <span className="text-xs font-black text-amber-700 px-3 py-1 bg-amber-100 rounded-full">
                              {mTopData.name}
                            </span>
                          </div>
                        );
                      })}
                    </div>

                    <button
                      onClick={() => setCurrentTab('charter')}
                      className="w-full py-4 bg-indigo-600 active:bg-indigo-700 text-white font-black text-base rounded-2xl shadow-xs"
                    >
                      우리 가족 삶의 헌장 보러가기 📜
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* -------------------- [TAB 4: FAMILY CHARTER] -------------------- */}
            {currentTab === 'charter' && (
              <div className="space-y-5">
                <div className="bg-amber-50 border-2 border-amber-300 rounded-3xl p-6 shadow-xs">
                  <div className="text-center mb-3">
                    <span className="text-4xl">📜</span>
                    <h2 className="text-xl font-black text-amber-950 mt-1">우리 가족 삶의 헌장</h2>
                  </div>
                  <div className="space-y-3 text-xs text-gray-800 leading-relaxed font-medium">
                    <div className="p-3 bg-white rounded-xl border border-amber-200 flex items-start gap-2">
                      <span className="text-amber-600 font-bold">1.</span>
                      <span><strong>각자의 속도를 존중합니다:</strong> 아빠의 쉼, 엄마의 새출발, 아이들의 성장을 재촉하지 않고 지지합니다.</span>
                    </div>
                    <div className="p-3 bg-white rounded-xl border border-amber-200 flex items-start gap-2">
                      <span className="text-amber-600 font-bold">2.</span>
                      <span><strong>두근거리는 도전을 격려합니다:</strong> 실패를 두려워하지 않고, 새로운 취미·공부·놀이의 호기심을 열어줍니다.</span>
                    </div>
                    <div className="p-3 bg-white rounded-xl border border-amber-200 flex items-start gap-2">
                      <span className="text-amber-600 font-bold">3.</span>
                      <span><strong>매일 15분 마음을 나눕니다:</strong> 저녁 식탁에서 오늘 감사했던 일과 호기심을 나누며 든든한 울타리가 됩니다.</span>
                    </div>
                  </div>
                </div>

                <div className="bg-white border border-gray-200 rounded-3xl p-5 shadow-xs">
                  <h3 className="text-sm font-black text-gray-900 mb-3 flex items-center gap-1.5">
                    <span>✨</span> 온 가족 6대 버킷 프로젝트 (놀이 포함)
                  </h3>
                  <div className="space-y-2.5 text-xs">
                    <div className="p-2.5 bg-amber-50 rounded-xl border border-amber-200">
                      <strong>💼 가족 팝업:</strong> 굿즈 기획 및 소품 펀딩 해보기
                    </div>
                    <div className="p-2.5 bg-sky-50 rounded-xl border border-sky-200">
                      <strong>📚 주말 인문학 살롱:</strong> 한 달에 한 편 명작 영화/책 토론
                    </div>
                    <div className="p-2.5 bg-emerald-50 rounded-xl border border-emerald-200">
                      <strong>🎨 온 가족 협동 목공:</strong> 거실 테이블이나 가족 문패 깎기
                    </div>
                    <div className="p-2.5 bg-yellow-50 rounded-xl border border-yellow-200 font-bold text-yellow-950">
                      <strong>🎲 가족 보드게임 리그:</strong> 주말 간식 내기 리그전
                    </div>
                    <div className="p-2.5 bg-rose-50 rounded-xl border border-rose-200">
                      <strong>🗺️ 제주 올레길 트레킹:</strong> 바다 바람을 맞으며 걷는 3박 4일
                    </div>
                    <div className="p-2.5 bg-purple-50 rounded-xl border border-purple-200">
                      <strong>☀️ 저녁 15분 하트 타임:</strong> 매일 1가지 감사 나누기
                    </div>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* 폰 넘기기 모달 */}
          {showPassModal && (
            <div className="absolute inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center p-6 z-50">
              <div className="bg-white rounded-3xl p-6 text-center max-w-xs w-full shadow-2xl">
                <div className="text-5xl mb-2">{FAMILY_MEMBERS[familyTurn].avatar}</div>
                <h4 className="text-lg font-black text-gray-900 mb-1">
                  [{FAMILY_MEMBERS[familyTurn].name}]에게 <br/>스마트폰을 넘겨주세요!
                </h4>
                <p className="text-xs text-gray-500 mb-5">
                  {FAMILY_MEMBERS[familyTurn].name}의 생각을 들을 차례입니다 💭
                </p>
                <div className="space-y-2">
                  <button
                    onClick={() => setShowPassModal(false)}
                    className="w-full py-3 bg-amber-500 active:bg-amber-600 text-white font-black text-sm rounded-xl shadow-xs"
                  >
                    준비 완료! 시작하기 ➜
                  </button>
                  {familyHistory.length > 0 && (
                    <button
                      onClick={() => { setShowPassModal(false); handleFamilyPrev(); }}
                      className="w-full py-2 bg-gray-100 active:bg-gray-200 text-gray-600 font-bold text-xs rounded-xl"
                    >
                      ↺ 방금 전 사람 다시 선택하기
                    </button>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* 하단 탭 바 */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-[480px] mx-auto bg-white/95 backdrop-blur-md border-t border-gray-200 px-6 py-2 z-40 safe-bottom flex justify-between shadow-lg">
            <button
              onClick={() => setCurrentTab('home')}
              className={`flex flex-col items-center gap-1 py-1 transition-all ${
                currentTab === 'home' ? 'text-amber-600 scale-105 font-black' : 'text-gray-400'
              }`}
            >
              <span className="text-xl">🏠</span>
              <span className="text-[11px]">홈</span>
            </button>
            <button
              onClick={() => setCurrentTab('solo')}
              className={`flex flex-col items-center gap-1 py-1 transition-all ${
                currentTab === 'solo' ? 'text-amber-600 scale-105 font-black' : 'text-gray-400'
              }`}
            >
              <span className="text-xl">🧘</span>
              <span className="text-[11px]">솔로 모드</span>
            </button>
            <button
              onClick={() => setCurrentTab('family')}
              className={`flex flex-col items-center gap-1 py-1 transition-all ${
                currentTab === 'family' ? 'text-amber-600 scale-105 font-black' : 'text-gray-400'
              }`}
            >
              <span className="text-xl">👨‍👩‍👧‍👦</span>
              <span className="text-[11px]">패밀리 릴레이</span>
            </button>
            <button
              onClick={() => setCurrentTab('charter')}
              className={`flex flex-col items-center gap-1 py-1 transition-all ${
                currentTab === 'charter' ? 'text-amber-600 scale-105 font-black' : 'text-gray-400'
              }`}
            >
              <span className="text-xl">📜</span>
              <span className="text-[11px]">가족 헌장</span>
            </button>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MobileApp />);
  </script>
</body>
</html>
