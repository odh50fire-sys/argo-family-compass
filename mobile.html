<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ARGO - 우리 가족 가치관 나침반 (모바일 앱)</title>
  <link rel="icon" type="image/x-icon" href="argo_icon.ico">
  <link rel="icon" type="image/png" href="argo_icon.png">
  <link rel="apple-touch-icon" href="argo_icon.png">
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F59E0B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Pretendard Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <!-- 50개 4지선다형 질문 & 6대 영역 데이터베이스 로드 -->
  <script src="questions-data.js"></script>

  <style>
    body {
      background-color: #F3F4F6;
      font-family: 'Pretendard', sans-serif;
      color: #1F2937;
      word-break: keep-all;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .mobile-screen {
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      background-color: #FDFBF7;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom, 20px);
    }
    .custom-scroll::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const FAMILY_MEMBERS = [
      { id: 'father', name: '아빠', age: 45, role: '휴직 중 (삶의 2막)', avatar: '🐻', badge: '쉼과 새로운 도약' },
      { id: 'mother', name: '엄마', age: 43, role: '이번 주 퇴직', avatar: '🦊', badge: '정체성의 확장' },
      { id: 'son', name: '아들', age: 12, role: '초등 5~6학년', avatar: '🐿️', badge: '호기심 모험가' },
      { id: 'daughter', name: '딸', age: 12, role: '초등 5~6학년', avatar: '🐰', badge: '창의적 예술가' }
    ];

    function MobileApp() {
      const [currentTab, setCurrentTab] = useState('home'); // 'home', 'solo', 'family', 'charter'
      const [courseCount, setCourseCount] = useState(30);

      // 로컬 스토리지 이력
      const [savedHistory, setSavedHistory] = useState([]);
      const [viewingRecord, setViewingRecord] = useState(null);

      useEffect(() => {
        try {
          const raw = localStorage.getItem('argo_family_history');
          if (raw) setSavedHistory(JSON.parse(raw));
        } catch (e) {
          console.error(e);
        }
      }, []);

      const saveRecord = (recordData) => {
        try {
          const updated = [recordData, ...savedHistory.slice(0, 29)];
          setSavedHistory(updated);
          localStorage.setItem('argo_family_history', JSON.stringify(updated));
        } catch (e) {
          console.error(e);
        }
      };

      const deleteRecord = (id, e) => {
        e.stopPropagation();
        const updated = savedHistory.filter(h => h.id !== id);
        setSavedHistory(updated);
        localStorage.setItem('argo_family_history', JSON.stringify(updated));
      };

      // 실시간 동적 질문 세션 상태 (페르소나별 맞춤 및 15/30/50개 세션)
      const [soloQuestions, setSoloQuestions] = useState([]);
      const [familyQuestions, setFamilyQuestions] = useState([]);

      // 솔로 모드 상태
      const [soloMember, setSoloMember] = useState(FAMILY_MEMBERS[0]);
      const [soloStep, setSoloStep] = useState(0);
      const [soloScores, setSoloScores] = useState({});
      const [soloHistory, setSoloHistory] = useState([]);
      const [soloFinished, setSoloFinished] = useState(false);
      const [activeRecoTab, setActiveRecoTab] = useState('career');

      // 패밀리 릴레이 모드 상태
      const [familyRound, setFamilyRound] = useState(0);
      const [familyTurn, setFamilyTurn] = useState(0);
      const [familyScores, setFamilyScores] = useState({ father: {}, mother: {}, son: {}, daughter: {} });
      const [familyHistory, setFamilyHistory] = useState([]);
      const [familyFinished, setFamilyFinished] = useState(false);
      const [showPassModal, setShowPassModal] = useState(false);

      // 세션 초기화 함수
      const initSoloSession = (member, count = courseCount) => {
        setSoloMember(member);
        setSoloStep(0);
        setSoloScores({});
        setSoloHistory([]);
        setSoloFinished(false);
        setViewingRecord(null);
        const dynamicList = generateDynamicQuestions(member.id, count);
        setSoloQuestions(dynamicList);
      };

      const initFamilySession = (count = courseCount) => {
        setFamilyRound(0);
        setFamilyTurn(0);
        setFamilyScores({ father: {}, mother: {}, son: {}, daughter: {} });
        setFamilyHistory([]);
        setFamilyFinished(false);
        setViewingRecord(null);
        const dynamicList = generateDynamicQuestions('father', count);
        setFamilyQuestions(dynamicList);
      };

      // 컴포넌트 마운트 시 초기 세션 생성
      useEffect(() => {
        initSoloSession(FAMILY_MEMBERS[0], 30);
        initFamilySession(30);
      }, []);

      // 오늘의 가치 질문 한 입
      const [dailyBiteIndex, setDailyBiteIndex] = useState(0);
      const dailyQuestions = [
        "오늘 하루 중 가장 가슴이 편안했던 순간은 언제였나요?",
        "10년 뒤 오늘, 내가 가장 자랑스러워하고 싶은 나의 모습은?",
        "오늘 가족 중 한 명에게 해주고 싶은 고마운 말 한마디는?",
        "어릴 때 시간 가는 줄 모르고 놀았던 놀이는 무엇이었나요?"
      ];

      const getTopValue = (scores) => {
        const entries = Object.entries(scores || {});
        if (entries.length === 0) return 'autonomy';
        entries.sort((a, b) => b[1] - a[1]);
        return entries[0][0];
      };

      // 솔로 선택
      const handleSoloChoice = (valueKey) => {
        const nextScores = { ...soloScores, [valueKey]: (soloScores[valueKey] || 0) + 1 };
        setSoloScores(nextScores);
        setSoloHistory([...soloHistory, { step: soloStep, valueKey }]);

        const qList = soloQuestions.length > 0 ? soloQuestions : DAD_DILEMMAS;
        if (soloStep + 1 < qList.length) {
          setSoloStep(soloStep + 1);
        } else {
          // 저장
          const topKey = getTopValue(nextScores);
          const newRecord = {
            id: 'solo_' + Date.now(),
            type: 'solo',
            date: new Date().toLocaleString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
            member: soloMember,
            courseCount,
            topKey,
            scores: nextScores
          };
          saveRecord(newRecord);

          setSoloFinished(true);
          if (window.confetti) window.confetti({ particleCount: 80, spread: 70 });
        }
      };

      // 솔로 이전 질문 되돌리기
      const handleSoloPrev = () => {
        if (soloStep === 0 || soloHistory.length === 0) return;
        const lastEntry = soloHistory[soloHistory.length - 1];
        const updatedHistory = soloHistory.slice(0, -1);

        const prevKey = lastEntry.valueKey;
        const updatedScores = { ...soloScores };
        if (updatedScores[prevKey] > 0) {
          updatedScores[prevKey] -= 1;
        }

        setSoloScores(updatedScores);
        setSoloHistory(updatedHistory);
        setSoloStep(soloStep - 1);
      };

      // 패밀리 릴레이 선택
      const handleFamilyChoice = (valueKey) => {
        const currentM = FAMILY_MEMBERS[familyTurn];
        const mScore = familyScores[currentM.id] || {};
        const updatedScore = { ...mScore, [valueKey]: (mScore[valueKey] || 0) + 1 };
        const nextScores = { ...familyScores, [currentM.id]: updatedScore };
        setFamilyScores(nextScores);

        setFamilyHistory([...familyHistory, {
          round: familyRound,
          turn: familyTurn,
          memberId: currentM.id,
          valueKey
        }]);

        if (familyTurn + 1 < FAMILY_MEMBERS.length) {
          setFamilyTurn(familyTurn + 1);
          setShowPassModal(true);
        } else {
          const qList = familyQuestions.length > 0 ? familyQuestions : DAD_DILEMMAS;
          if (familyRound + 1 < qList.length) {
            setFamilyRound(familyRound + 1);
            setFamilyTurn(0);
            setShowPassModal(true);
          } else {
            // 패밀리 완료 저장
            const familySummary = {};
            FAMILY_MEMBERS.forEach(m => {
              familySummary[m.id] = getTopValue(nextScores[m.id]);
            });
            const newRecord = {
              id: 'family_' + Date.now(),
              type: 'family',
              date: new Date().toLocaleString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
              courseCount,
              familyScores: nextScores,
              familySummary
            };
            saveRecord(newRecord);

            setFamilyFinished(true);
            if (window.confetti) window.confetti({ particleCount: 100, spread: 80 });
          }
        }
      };

      // 패밀리 이전 턴 되돌리기
      const handleFamilyPrev = () => {
        if (familyHistory.length === 0) return;
        const lastEntry = familyHistory[familyHistory.length - 1];
        const updatedHistory = familyHistory.slice(0, -1);

        const { memberId, valueKey, round, turn } = lastEntry;
        const mScore = { ...familyScores[memberId] };
        if (mScore[valueKey] > 0) {
          mScore[valueKey] -= 1;
        }
        setFamilyScores({ ...familyScores, [memberId]: mScore });

        setFamilyHistory(updatedHistory);
        setFamilyRound(round);
        setFamilyTurn(turn);
      };

      // 이력 열람
      const openHistoryRecord = (rec) => {
        setViewingRecord(rec);
        if (rec.type === 'solo') {
          setSoloMember(rec.member);
          setSoloScores(rec.scores);
          setSoloFinished(true);
          setCurrentTab('solo');
        } else {
          setFamilyScores(rec.familyScores);
          setFamilyFinished(true);
          setCurrentTab('family');
        }
      };

      const optionLabels = ['A', 'B', 'C', 'D'];

      return (
        <div className="mobile-screen">
          {/* 상단 모바일 앱 헤더 */}
          <header className="px-5 py-4 bg-white/95 backdrop-blur-md sticky top-0 z-30 border-b border-gray-100 flex items-center justify-between shadow-2xs">
            <div className="flex items-center gap-2" onClick={() => setCurrentTab('home')}>
              <span className="text-2xl">🧭</span>
              <div>
                <span className="font-black text-xl text-gray-900 tracking-tight">ARGO</span>
                <span className="ml-1 text-[11px] font-bold px-2 py-0.5 bg-amber-100 text-amber-800 rounded-full">4지선다형</span>
              </div>
            </div>
            <div className="text-xs font-extrabold text-amber-600 bg-amber-50 px-2.5 py-1 rounded-lg border border-amber-200">
              {courseCount}문항
            </div>
          </header>

          {/* 메인 스크롤 영역 */}
          <main className="flex-1 overflow-y-auto px-5 py-6 custom-scroll pb-28">

            {/* -------------------- [TAB 1: HOME] -------------------- */}
            {currentTab === 'home' && (
              <div className="space-y-6">
                <div className="bg-gradient-to-br from-amber-400 via-amber-500 to-orange-500 text-white rounded-3xl p-6 shadow-md">
                  <span className="text-xs font-black uppercase tracking-wider bg-white/20 px-3 py-1 rounded-full">
                    50 SCENARIOS & 6 DIMENSIONS
                  </span>
                  <h1 className="text-2xl font-black mt-3 mb-2 leading-tight">
                    생생한 상황으로 찾는 <br/>우리 가족의 진짜 가치
                  </h1>
                  <p className="text-xs text-amber-50 leading-relaxed">
                    4지선다형 질문과 6대 영역(각 영역별 5개 이상의 구체적 추천)을 만나보세요.
                  </p>
                </div>

                {/* 오늘의 생각 한 입 */}
                <div className="bg-white border-2 border-amber-200 rounded-2xl p-4 shadow-2xs">
                  <div className="flex items-center justify-between mb-1.5">
                    <span className="text-xs font-black text-amber-600 flex items-center gap-1">
                      <span>💡</span> 오늘의 생각 한 입
                    </span>
                    <button 
                      onClick={() => setDailyBiteIndex((dailyBiteIndex + 1) % dailyQuestions.length)}
                      className="text-xs font-bold text-gray-400"
                    >
                      다른 질문 ↻
                    </button>
                  </div>
                  <p className="text-base font-bold text-gray-800 leading-snug">
                    "{dailyQuestions[dailyBiteIndex]}"
                  </p>
                </div>

                {/* 저장된 진단 기록 보관소 (모바일) */}
                {savedHistory.length > 0 && (
                  <div className="bg-white border-2 border-indigo-200 rounded-3xl p-4 shadow-2xs">
                    <div className="flex items-center justify-between mb-3">
                      <span className="text-sm font-black text-gray-900 flex items-center gap-1.5">
                        <span>📜</span> 저장된 진단 기록 ({savedHistory.length}개)
                      </span>
                      <span className="text-[10px] text-indigo-600 font-bold">터치하여 다시보기</span>
                    </div>
                    <div className="space-y-2 max-h-48 overflow-y-auto pr-1 custom-scroll">
                      {savedHistory.map((rec) => {
                        const topData = SIX_DIMENSIONS_RECOMMENDATIONS[rec.topKey] || SIX_DIMENSIONS_RECOMMENDATIONS.autonomy;
                        return (
                          <div
                            key={rec.id}
                            onClick={() => openHistoryRecord(rec)}
                            className="p-3 bg-indigo-50/50 active:bg-indigo-100/70 border border-indigo-100 rounded-xl flex items-center justify-between transition-all"
                          >
                            <div className="flex items-center gap-2">
                              <span className="text-2xl">{rec.type === 'solo' ? rec.member?.avatar : '👨‍👩‍👧‍👦'}</span>
                              <div>
                                <div className="font-black text-xs text-gray-900">
                                  {rec.type === 'solo' ? `${rec.member?.name}의 나침반` : '온 가족 릴레이'}
                                  <span className="ml-1 text-[10px] text-amber-700 bg-amber-100 px-1.5 py-0.2 rounded-full font-bold">
                                    {rec.type === 'solo' ? topData.name.split(' ')[0] : '헌장'}
                                  </span>
                                </div>
                                <div className="text-[10px] text-gray-400">{rec.date}</div>
                              </div>
                            </div>
                            <button
                              onClick={(e) => deleteRecord(rec.id, e)}
                              className="text-gray-300 text-xs px-2 py-1"
                            >
                              ✕
                            </button>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                {/* 질문 분량 선택 */}
                <div className="bg-white border border-gray-200 rounded-2xl p-4 shadow-2xs">
                  <div className="text-xs font-black text-gray-500 mb-2">질문 코스 선택</div>
                  <div className="grid grid-cols-3 gap-2">
                    {[
                      { count: 15, label: '15문항', desc: '5분 스피드' },
                      { count: 30, label: '30문항', desc: '10분 밸런스(추천)' },
                      { count: 50, label: '50문항', desc: '20분 완전심층' }
                    ].map(c => (
                      <button
                        key={c.count}
                        onClick={() => {
                          setCourseCount(c.count);
                          initSoloSession(soloMember, c.count);
                          initFamilySession(c.count);
                        }}
                        className={`py-2 px-1.5 rounded-xl text-center border-2 transition-all ${
                          courseCount === c.count ? 'border-amber-500 bg-amber-50 text-amber-900 font-black ring-1 ring-amber-400' : 'border-gray-200 text-gray-500 font-bold'
                        }`}
                      >
                        <div className="text-sm font-black">{c.label}</div>
                        <div className="text-[9px] opacity-75">{c.desc}</div>
                      </button>
                    ))}
                  </div>
                </div>

                {/* 4인 프로필 */}
                <div>
                  <h2 className="text-xs font-bold text-gray-400 mb-2 px-1">우리 가족 4인 프로필</h2>
                  <div className="grid grid-cols-2 gap-2.5">
                    {FAMILY_MEMBERS.map(m => (
                      <div key={m.id} className="bg-white border border-gray-200 rounded-2xl p-3 flex items-center gap-2.5 shadow-2xs">
                        <span className="text-2xl">{m.avatar}</span>
                        <div>
                          <div className="font-black text-sm text-gray-900">{m.name} <span className="text-xs text-gray-400 font-normal">({m.age}세)</span></div>
                          <div className="text-[11px] font-bold text-amber-700">{m.badge}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* 모드 실행 버튼 2개 */}
                <div className="space-y-3 pt-1">
                  <button
                    onClick={() => { initSoloSession(soloMember, courseCount); setCurrentTab('solo'); }}
                    className="w-full text-left p-4 bg-white border-2 border-amber-300 active:border-amber-500 rounded-2xl shadow-2xs flex items-center justify-between"
                  >
                    <div className="flex items-center gap-3">
                      <div className="w-12 h-12 rounded-xl bg-amber-100 flex items-center justify-center text-2xl shrink-0">
                        🧘
                      </div>
                      <div>
                        <span className="text-[11px] font-black text-amber-700">모드 1. 혼자 깊이 생각하기</span>
                        <div className="text-lg font-black text-gray-900">솔로 맞춤 모드 ({courseCount}문항)</div>
                        <div className="text-[11px] text-gray-500 mt-0.5">나이·생활환경 맞춤 실시간 질문 생성</div>
                      </div>
                    </div>
                    <span className="text-lg text-amber-500 font-bold">➜</span>
                  </button>

                  <button
                    onClick={() => { initFamilySession(courseCount); setCurrentTab('family'); }}
                    className="w-full text-left p-4 bg-white border-2 border-indigo-300 active:border-indigo-500 rounded-2xl shadow-2xs flex items-center justify-between"
                  >
                    <div className="flex items-center gap-3">
                      <div className="w-12 h-12 rounded-xl bg-indigo-100 flex items-center justify-center text-2xl shrink-0">
                        👨‍👩‍👧‍👦
                      </div>
                      <div>
                        <span className="text-[11px] font-black text-indigo-700">모드 2. 폰 넘겨가며 대화하기</span>
                        <div className="text-lg font-black text-gray-900">패밀리 릴레이 모드 ({courseCount}문항)</div>
                        <div className="text-[11px] text-gray-500 mt-0.5">둘러앉아 함께 채우는 가족 나침반</div>
                      </div>
                    </div>
                    <span className="text-lg text-indigo-500 font-bold">➜</span>
                  </button>
                </div>
              </div>
            )}

            {/* -------------------- [TAB 2: SOLO MODE] -------------------- */}
            {currentTab === 'solo' && (
              <div>
                {!soloFinished ? (
                  <div className="space-y-4">
                    {/* 상단 멤버 선택 */}
                    <div className="flex gap-2 overflow-x-auto pb-1 custom-scroll">
                      {FAMILY_MEMBERS.map(m => (
                        <button
                          key={m.id}
                          onClick={() => { initSoloSession(m, courseCount); }}
                          className={`px-3 py-1.5 rounded-full text-xs font-black flex items-center gap-1 shrink-0 ${
                            soloMember.id === m.id ? 'bg-amber-500 text-white shadow-2xs' : 'bg-white border border-gray-200 text-gray-600'
                          }`}
                        >
                          <span>{m.avatar}</span>
                          <span>{m.name}</span>
                        </button>
                      ))}
                    </div>

                    {/* 진행률 바 & 되돌아가기 */}
                    <div className="flex items-center justify-between text-xs font-bold text-gray-400">
                      <div className="flex items-center gap-2">
                        <span className="text-gray-800 font-black">{soloMember.name} ({soloMember.age}세) 맞춤형</span>
                        {soloStep > 0 && (
                          <button
                            onClick={handleSoloPrev}
                            className="text-amber-700 bg-amber-100 px-2 py-0.5 rounded-md font-black flex items-center gap-0.5 active:bg-amber-200"
                          >
                            <span>↺ 이전 질문</span>
                          </button>
                        )}
                      </div>
                      <span className="text-amber-600 font-black">{soloStep + 1} / {(soloQuestions && soloQuestions.length > 0) ? soloQuestions.length : courseCount}</span>
                    </div>
                    <div className="w-full h-2 bg-gray-200 rounded-full overflow-hidden">
                      <div 
                        className="h-full bg-amber-500 transition-all duration-300"
                        style={{ width: `${((soloStep + 1) / ((soloQuestions && soloQuestions.length > 0) ? soloQuestions.length : courseCount)) * 100}%` }}
                      ></div>
                    </div>

                    {/* 1문항 4지선다형 질문 카드 */}
                    {(() => {
                      const qList = (soloQuestions && soloQuestions.length > 0) ? soloQuestions : DAD_DILEMMAS;
                      const currentQ = qList[soloStep] || qList[0];
                      const optionLabels = ['A', 'B', 'C', 'D'];
                      return (

                                </div>

                              {activeRecoTab === 'study' && (
                                <div className="space-y-2">
                                  <div className="text-xs font-black text-sky-700 mb-1">📚 추천 공부 및 배움 분야 5가지</div>
                                  {topData.study.map((item, idx) => (
                                    <div key={idx} className="p-3 bg-sky-50/70 rounded-xl border border-sky-200 flex items-start gap-2">

                                onClick={handleFamilyPrev}
                                className="text-[11px] text-gray-400 font-bold"

                              </button>
                            )}

                          <h3 className="text-base font-black text-gray-900 mt-1 mb-2 leading-snug">
                            {currentQ.question}

                          <div className="p-3 bg-indigo-50 rounded-xl text-xs font-bold text-indigo-900 mb-4 leading-relaxed">

                                  <div className="text-xs font-black text-gray-900 leading-tight mb-0.5">
                                    {opt.text}

                                  <div className="text-[10px] text-indigo-700 font-bold">
                                    💡 {opt.desc}

                      <h2 className="text-xl font-black mb-1">온 가족 가치관 지도 완성!</h2>

                          <div key={m.id} className="flex items-center justify-between p-3 bg-gray-50 rounded-xl">

                      onClick={() => setCurrentTab('charter')}

                    >

            <div className="absolute inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center p-6 z-50">
              <div className="bg-white rounded-3xl p-6 text-center max-w-xs w-full shadow-2xl">
                <div className="text-5xl mb-2">{FAMILY_MEMBERS[familyTurn].avatar}</div>
                <h4 className="text-lg font-black text-gray-900 mb-1">
                  [{FAMILY_MEMBERS[familyTurn].name}]에게 <br/>스마트폰을 넘겨주세요!
                </h4>
                <p className="text-xs text-gray-500 mb-5">
                  {FAMILY_MEMBERS[familyTurn].name}의 생각을 들을 차례입니다 💭

                  <button
                    onClick={() => setShowPassModal(false)}

          {/* 하단 탭 바 */}

              }`}
            >
              <span className="text-xl">🏠</span>
              <span className="text-[11px]">홈</span>
            </button>
            <button
              onClick={() => setCurrentTab('solo')}
              className={`flex flex-col items-center gap-1 py-1 transition-all ${
                currentTab === 'solo' ? 'text-amber-600 scale-105 font-black' : 'text-gray-400'
              }`}
            >
              <span className="text-xl">🧘</span>
              <span className="text-[11px]">솔로 모드</span>

            <button
              onClick={() => setCurrentTab('family')}
              className={`flex flex-col items-center gap-1 py-1 transition-all ${
                currentTab === 'family' ? 'text-amber-600 scale-105 font-black' : 'text-gray-400'

            >
              <span className="text-xl">👨‍👩‍👧‍👦</span>
              <span className="text-[11px]">패밀리 릴레이</span>
            </button>
            <button
              onClick={() => setCurrentTab('charter')}
              className={`flex flex-col items-center gap-1 py-1 transition-all ${
                currentTab === 'charter' ? 'text-amber-600 scale-105 font-black' : 'text-gray-400'
              }`}
            >
              <span className="text-xl">📜</span>
              <span className="text-[11px]">가족 헌장</span>
            </button>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MobileApp />);
  </script>
