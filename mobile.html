          setSoloFinished(true);

          ...roundData,
          [member.id]: { valueKey, valueName, name: member.name, avatar: member.avatar }
        };

                    </div>
                    <div className="p-3 bg-rose-50 rounded-xl border border-rose-200">
                      <strong>🗺️ 제주 올레길 트레킹:</strong> 바다 바람을 맞으며 걷는 3박 4일
                    </div>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* 폰 넘기기 모달 (Pass & Play) */}
          {showPassModal && (
            <div className="absolute inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center p-6 z-50">
              <div className="bg-white rounded-3xl p-6 text-center max-w-xs w-full shadow-2xl animate-bounce-short">
                <div className="text-5xl mb-3">{FAMILY_MEMBERS[familyTurn].avatar}</div>
                <h4 className="text-xl font-black text-gray-900 mb-1">
                  [{FAMILY_MEMBERS[familyTurn].name}]에게 <br/>스마트폰을 넘겨주세요!
                </h4>
                <p className="text-xs text-gray-500 mb-6">
                  {FAMILY_MEMBERS[familyTurn].name}의 생각을 들을 차례입니다 💭
                </p>
                <button
                  onClick={() => setShowPassModal(false)}
                  className="w-full py-3.5 bg-amber-500 active:bg-amber-600 text-white font-bold text-base rounded-2xl shadow-sm"
                >
                  준비 완료! 시작하기 ➜
                </button>
              </div>
            </div>
          )}

          {/* 하단 고정 네비게이션 탭 바 (Thumb Zone 최적화) */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-[480px] mx-auto bg-white/95 backdrop-blur-md border-t border-gray-200 px-6 py-2 z-40 safe-bottom flex justify-between shadow-lg">
            <button
              onClick={() => setCurrentTab('home')}
              className={`flex flex-col items-center gap-1 py-1 transition-all ${
                currentTab === 'home' ? 'text-amber-600 scale-105 font-bold' : 'text-gray-400'
              }`}
            >
              <span className="text-xl">🏠</span>
              <span className="text-[11px]">홈</span>
            </button>
            <button
              onClick={() => setCurrentTab('solo')}
              className={`flex flex-col items-center gap-1 py-1 transition-all ${
                currentTab === 'solo' ? 'text-amber-600 scale-105 font-bold' : 'text-gray-400'
              }`}
            >
              <span className="text-xl">🧘</span>
              <span className="text-[11px]">솔로 모드</span>
            </button>
            <button
              onClick={() => setCurrentTab('family')}
              className={`flex flex-col items-center gap-1 py-1 transition-all ${
                currentTab === 'family' ? 'text-amber-600 scale-105 font-bold' : 'text-gray-400'
              }`}
            >
              <span className="text-xl">👨‍👩‍👧‍👦</span>
              <span className="text-[11px]">패밀리 릴레이</span>
            </button>
            <button
              onClick={() => setCurrentTab('charter')}
              className={`flex flex-col items-center gap-1 py-1 transition-all ${
                currentTab === 'charter' ? 'text-amber-600 scale-105 font-bold' : 'text-gray-400'
              }`}
            >
              <span className="text-xl">📜</span>
              <span className="text-[11px]">가족 헌장</span>
            </button>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MobileApp />);
  </script>
</body>
</html>
