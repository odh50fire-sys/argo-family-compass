          ...roundData,

          ...familyAnswers,
          [currentDilemma.id]: updatedRound
        };
        setFamilyAnswers(updatedFamily);

                <span className="text-amber-600 font-bold text-base md:text-lg">VALUE-ALIGNED RECOMMENDATIONS</span>
                <h3 className="text-3xl md:text-4xl font-extrabold text-gray-900 mt-1">
                  확인된 가치관에 맞춘 5대 영역 심층 제안
                </h3>
                <p className="text-gray-600 text-lg mt-2">
                  단순한 목록이 아닌, {soloMember.name}님의 심장을 다시 뛰게 할 구체적인 활력의 경로입니다.
                </p>
              </div>

              <div className="space-y-6">
                {/* 1. 직업 */}
                <div className="bg-white border-2 border-amber-200 rounded-3xl p-8 shadow-md">
                  <div className="flex items-center gap-3 mb-4">
                    <div className="w-12 h-12 rounded-2xl bg-amber-100 text-amber-700 flex items-center justify-center text-2xl font-bold">💼</div>
                    <div>
                      <span className="text-xs font-bold text-amber-600 tracking-wide uppercase">DIMENSION 01</span>
                      <h4 className="text-2xl font-extrabold text-gray-900">직업 (Career & Vocation)</h4>
                    </div>
                  </div>
                  <div className="text-lg md:text-xl font-bold text-amber-900 bg-amber-50/70 p-4 rounded-2xl border border-amber-200 mb-3">
                    {isAdult ? reco.career.adult : reco.career.child}
                  </div>
                  <p className="text-gray-600 text-base md:text-lg leading-relaxed">
                    {isAdult 
                      ? '기존의 조직적 틀에 얽매이지 않고, 나의 전문성과 철학을 온전히 녹여낼 수 있는 독립적 포트폴리오 노동 또는 소명형 일자리가 가장 큰 성취감을 줍니다.'
                      : '남이 시키는 공부 대신, 스스로 문제를 정하고 주도적으로 해결책을 만들어내는 프로젝트형 리더로 성장할 때 최고의 활력이 솟아납니다.'}
                  </p>
                </div>

                {/* 2. 공부 */}
                <div className="bg-white border-2 border-sky-200 rounded-3xl p-8 shadow-md">
                  <div className="flex items-center gap-3 mb-4">
                    <div className="w-12 h-12 rounded-2xl bg-sky-100 text-sky-700 flex items-center justify-center text-2xl font-bold">📚</div>
                    <div>
                      <span className="text-xs font-bold text-sky-600 tracking-wide uppercase">DIMENSION 02</span>
                      <h4 className="text-2xl font-extrabold text-gray-900">공부 (Learning & Growth)</h4>
                    </div>
                  </div>
                  <div className="text-lg md:text-xl font-bold text-sky-900 bg-sky-50/70 p-4 rounded-2xl border border-sky-200 mb-3">
                    {reco.study}
                  </div>
                  <p className="text-gray-600 text-base md:text-lg leading-relaxed">
                    단순 점수나 자격증이 아닌, 세상을 바라보는 눈을 넓히고 지적 경외감을 느낄 수 있는 심층 탐구에 몰입할 때 내면의 단단한 자존감이 형성됩니다.
                  </p>
                </div>

                {/* 3. 취미 */}
                <div className="bg-white border-2 border-emerald-200 rounded-3xl p-8 shadow-md">
                  <div className="flex items-center gap-3 mb-4">
                    <div className="w-12 h-12 rounded-2xl bg-emerald-100 text-emerald-700 flex items-center justify-center text-2xl font-bold">🎨</div>
                    <div>
                      <span className="text-xs font-bold text-emerald-600 tracking-wide uppercase">DIMENSION 03</span>
                      <h4 className="text-2xl font-extrabold text-gray-900">취미 (Flow & Creativity)</h4>
                    </div>
                  </div>
                  <div className="text-lg md:text-xl font-bold text-emerald-900 bg-emerald-50/70 p-4 rounded-2xl border border-emerald-200 mb-3">
                    {reco.hobby}
                  </div>
                  <p className="text-gray-600 text-base md:text-lg leading-relaxed">
                    수동적인 미디어 시청 대신, 내 손으로 무언가를 빚어내고 몸의 감각을 깨우는 <strong>능동적 몰입(Flow)</strong> 활동이 진정한 휴식과 기쁨을 선사합니다.
                  </p>
                </div>

                {/* 4. 여행지 */}
                <div className="bg-white border-2 border-rose-200 rounded-3xl p-8 shadow-md">
                  <div className="flex items-center gap-3 mb-4">
                    <div className="w-12 h-12 rounded-2xl bg-rose-100 text-rose-700 flex items-center justify-center text-2xl font-bold">🗺️</div>
                    <div>
                      <span className="text-xs font-bold text-rose-600 tracking-wide uppercase">DIMENSION 04</span>
                      <h4 className="text-2xl font-extrabold text-gray-900">여행지 (Transformative Travel)</h4>
                    </div>
                  </div>
                  <div className="text-lg md:text-xl font-bold text-rose-900 bg-rose-50/70 p-4 rounded-2xl border border-rose-200 mb-3">
                    {reco.travel}
                  </div>
                  <p className="text-gray-600 text-base md:text-lg leading-relaxed">
                    사람 많은 상업적 관광지를 벗어나, 내면의 소리를 듣고 깊은 영감을 채울 수 있는 성찰과 치유의 공간으로 떠나보세요.
                  </p>
                </div>

                {/* 5. 생활활동 */}
                <div className="bg-white border-2 border-purple-200 rounded-3xl p-8 shadow-md">
                  <div className="flex items-center gap-3 mb-4">
                    <div className="w-12 h-12 rounded-2xl bg-purple-100 text-purple-700 flex items-center justify-center text-2xl font-bold">☀️</div>
                    <div>
                      <span className="text-xs font-bold text-purple-600 tracking-wide uppercase">DIMENSION 05</span>
                      <h4 className="text-2xl font-extrabold text-gray-900">생활활동 (Daily Rituals)</h4>
                    </div>
                  </div>
                  <div className="text-lg md:text-xl font-bold text-purple-900 bg-purple-50/70 p-4 rounded-2xl border border-purple-200 mb-3">
                    {reco.life}
                  </div>
                  <p className="text-gray-600 text-base md:text-lg leading-relaxed">
                    하루의 시작과 끝을 단단하게 지탱해 주는 작은 리추얼을 통해, 흔들리지 않는 삶의 균형과 생명력을 매일 충전합니다.
                  </p>
                </div>
              </div>
            </div>

            {/* 하단 다른 가족 진행 유도 버튼 */}
            <div className="text-center py-6">
              <button 
                onClick={() => setView('solo_select')}
                className="py-4 px-8 bg-amber-500 hover:bg-amber-600 text-white font-bold text-xl rounded-2xl shadow-lg transition-colors inline-flex items-center gap-3"
              >
                <span>다른 가족 멤버도 진행해보기</span>
                <span>➜</span>
              </button>
            </div>
          </div>
        );
      }

      // ==========================================
      // 화면 5: 패밀리 서클 릴레이 모드 진행 뷰
      // ==========================================
      if (view === 'family_play') {
        const dilemma = VALUE_DILEMMAS[familyRound];
        const currentMember = FAMILY_MEMBERS[familyTurn];
        const currentRoundAnswers = familyAnswers[dilemma.id] || {};

        return (
          <div className="max-w-4xl mx-auto px-6 py-10">
            {/* 상단 턴 안내 배너 */}
            <div className="bg-indigo-900 text-white rounded-3xl p-6 md:p-8 shadow-xl mb-8 flex flex-col md:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-4 text-center md:text-left">
                <div className="text-6xl animate-bounce-short">{currentMember.avatar}</div>
                <div>
                  <div className="inline-block px-3 py-1 bg-indigo-700 text-indigo-200 rounded-full text-sm font-bold mb-1">
                    라운드 {familyRound + 1} / {VALUE_DILEMMAS.length} · 온 가족 릴레이
                  </div>
                  <h2 className="text-3xl md:text-4xl font-extrabold">
                    지금은 <span className="text-amber-400">[{currentMember.name}]</span>의 차례입니다!
                  </h2>
                </div>
              </div>
              <div className="flex gap-2">
                {FAMILY_MEMBERS.map((m, idx) => {
                  const isDone = currentRoundAnswers[m.id];
                  const isCurrent = idx === familyTurn;
                  return (
                    <div 
                      key={m.id}
                      className={`w-12 h-12 rounded-2xl flex items-center justify-center text-2xl transition-all ${
                        isCurrent ? 'bg-amber-400 scale-110 shadow-lg ring-4 ring-white' : isDone ? 'bg-indigo-700 opacity-60' : 'bg-indigo-800'
                      }`}
                    >
                      {m.avatar}
                    </div>
                  );
                })}
              </div>
            </div>

            {/* 공통 딜레마 질문 카드 */}
            <div className="bg-white border-2 border-indigo-200 rounded-3xl p-8 md:p-10 shadow-lg mb-8">
              <div className="text-indigo-600 font-bold text-base md:text-lg mb-2">
                {dilemma.title}
              </div>
              <h3 className="text-2xl md:text-3xl font-extrabold text-gray-900 leading-snug mb-3">
                {dilemma.question}
              </h3>
              
              {/* 가족 대화 힌트 카드 */}
              <div className="p-4 bg-indigo-50 border border-indigo-200 rounded-2xl text-indigo-900 font-medium text-base md:text-lg mb-8">
                {dilemma.familyTopic}
              </div>

              {/* 양자택일 선택 버튼 2개 */}
              <div className="grid md:grid-cols-2 gap-6">
                <button
                  onClick={() => handleFamilyAnswer(dilemma.optionA.valueKey, dilemma.optionA.valueName)}
                  className="p-8 text-left bg-amber-50/70 hover:bg-amber-100 border-3 border-amber-200 hover:border-amber-500 rounded-2xl transition-all shadow-sm hover:shadow-md group flex flex-col justify-between"
                >
                  <div>
                    <span className="text-5xl mb-4 block group-hover:scale-110 transition-transform">
                      {dilemma.optionA.emoji}
                    </span>
                    <div className="text-2xl font-bold text-gray-900 mb-2">
                      {dilemma.optionA.title}
                    </div>
                    <div className="text-base md:text-lg text-gray-700 leading-relaxed">
                      {dilemma.optionA.desc}
                    </div>
                  </div>
                  <div className="mt-6 pt-4 border-t border-amber-200/60 text-amber-800 font-bold text-base flex items-center gap-1">
                    <span>{currentMember.name}의 선택</span> <span>➜</span>
                  </div>
                </button>

                <button
                  onClick={() => handleFamilyAnswer(dilemma.optionB.valueKey, dilemma.optionB.valueName)}
                  className="p-8 text-left bg-indigo-50/70 hover:bg-indigo-100 border-3 border-indigo-200 hover:border-indigo-500 rounded-2xl transition-all shadow-sm hover:shadow-md group flex flex-col justify-between"
                >
                  <div>
                    <span className="text-5xl mb-4 block group-hover:scale-110 transition-transform">
                      {dilemma.optionB.emoji}
                    </span>
                    <div className="text-2xl font-bold text-gray-900 mb-2">
                      {dilemma.optionB.title}
                    </div>
                    <div className="text-base md:text-lg text-gray-700 leading-relaxed">
                      {dilemma.optionB.desc}
                    </div>
                  </div>
                  <div className="mt-6 pt-4 border-t border-indigo-200/60 text-indigo-800 font-bold text-base flex items-center gap-1">
                    <span>{currentMember.name}의 선택</span> <span>➜</span>
                  </div>
                </button>
              </div>
            </div>

            {/* 이번 라운드 가족들의 실시간 선택 현황판 */}
            <div className="bg-gray-50 border border-gray-200 rounded-2xl p-6">
              <h4 className="font-bold text-lg text-gray-800 mb-4 flex items-center gap-2">
                <span>👀</span> 이 질문에 대한 우리 가족의 실시간 선택
              </h4>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                {FAMILY_MEMBERS.map(m => {
                  const ans = currentRoundAnswers[m.id];
                  return (
                    <div key={m.id} className="p-4 bg-white rounded-xl border border-gray-200 text-center">
                      <div className="text-3xl mb-1">{m.avatar}</div>
                      <div className="font-bold text-gray-900">{m.name}</div>
                      <div className="text-sm font-semibold text-indigo-600 mt-1">
                        {ans ? ans.valueName : '생각 중... 💭'}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        );
      }

      // ==========================================
      // 화면 6: 패밀리 서클 릴레이 결과 뷰 (가족 시너지 & 헌장)
      // ==========================================
      if (view === 'family_result') {
        return (
          <div className="max-w-4xl mx-auto px-6 py-12">
            <button 
              onClick={() => setView('home')} 
              className="text-gray-500 hover:text-gray-800 text-lg font-medium mb-6 flex items-center gap-2"
            >
              ← 메인으로 돌아가기
            </button>

            {/* 패밀리 피날레 헤더 */}
            <div className="bg-gradient-to-r from-indigo-700 via-purple-700 to-pink-600 text-white rounded-3xl p-8 md:p-12 shadow-2xl mb-12 text-center">
              <div className="flex justify-center gap-3 text-5xl md:text-6xl mb-4">
                <span>🐻</span><span>🦊</span><span>🐿️</span><span>🐰</span>
              </div>
              <span className="px-4 py-1.5 bg-white/20 rounded-full font-bold text-sm tracking-wider uppercase">
                FAMILY SYNERGY COMPASS
              </span>
              <h2 className="text-3xl md:text-5xl font-black mt-4 mb-4">
                우리 가족 가치관 나침반 & 삶의 헌장 완성!
              </h2>
              <p className="text-lg md:text-xl text-purple-100 max-w-2xl mx-auto leading-relaxed">
                서로의 다른 가치를 확인하고, 깊이 공감한 이 시간이야말로 <br/>
                새로운 인생 2막을 여는 가장 든든한 밑거름입니다.
              </p>
            </div>

            {/* 온 가족 가치관 비교 매트릭스 */}
            <div className="bg-white border-2 border-indigo-200 rounded-3xl p-8 shadow-lg mb-12">
              <h3 className="text-2xl md:text-3xl font-extrabold text-gray-900 mb-6 flex items-center gap-2">
                <span>🗺️</span> 4인 4색: 우리 가족의 가치관 지도
              </h3>
              <div className="space-y-6">
                {VALUE_DILEMMAS.map((d, dIdx) => {
                  const roundAns = familyAnswers[d.id] || {};
                  return (
                    <div key={d.id} className="p-6 bg-gray-50 rounded-2xl border border-gray-200">
                      <div className="font-extrabold text-xl text-gray-900 mb-4">
                        {dIdx + 1}. {d.title}
                      </div>
                      <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                        {FAMILY_MEMBERS.map(m => {
                          const userAns = roundAns[m.id];
                          return (
                            <div key={m.id} className="bg-white p-4 rounded-xl border border-gray-200 text-center">
                              <span className="text-3xl">{m.avatar}</span>
                              <div className="font-bold text-gray-800 mt-1">{m.name}</div>
                              <div className="text-sm font-extrabold text-amber-700 mt-1">
                                {userAns?.valueName || '-'}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* 우리 가족 공동 헌장 (Family Charter) */}
            <div className="bg-amber-50 border-3 border-amber-300 rounded-3xl p-8 md:p-10 shadow-lg mb-12">
              <div className="text-center mb-6">
                <span className="text-4xl">📜</span>
                <h3 className="text-2xl md:text-3xl font-black text-amber-950 mt-2">
                  우리가 함께 쓴 「우리 가족 삶의 헌장」
                </h3>
              </div>
              <div className="space-y-4 max-w-2xl mx-auto text-lg md:text-xl text-gray-800 leading-relaxed font-medium">
                <div className="p-4 bg-white/80 rounded-2xl shadow-sm border border-amber-200 flex items-start gap-3">
                  <span className="text-2xl">1.</span>
                  <span><strong>각자의 속도와 자유를 존중합니다:</strong> 아빠의 쉼과 엄마의 새출발, 아이들의 배움을 누구도 재촉하지 않고 온전히 지지합니다.</span>
                </div>
                <div className="p-4 bg-white/80 rounded-2xl shadow-sm border border-amber-200 flex items-start gap-3">
                  <span className="text-2xl">2.</span>
                  <span><strong>가슴 뛰는 도전을 격려합니다:</strong> 실패를 두려워하지 않고, 새로운 취미와 공부, 여행을 함께 응원합니다.</span>
                </div>
                <div className="p-4 bg-white/80 rounded-2xl shadow-sm border border-amber-200 flex items-start gap-3">
                  <span className="text-2xl">3.</span>
                  <span><strong>매일 15분, 마음을 나눕니다:</strong> 저녁 식탁에서 오늘 감사했던 일과 호기심을 나누며 서로의 울타리가 되어줍니다.</span>
                </div>
              </div>
            </div>

            {/* 온 가족 5대 버킷 프로젝트 제안 */}
            <div className="bg-white border-2 border-purple-200 rounded-3xl p-8 shadow-lg mb-12">
              <h3 className="text-2xl md:text-3xl font-extrabold text-gray-900 mb-6 flex items-center gap-2">
                <span>✨</span> 네 사람이 함께 떠날 「공동 5대 버킷 프로젝트」
              </h3>
              <div className="grid md:grid-cols-2 gap-6">
                <div className="p-6 bg-purple-50 rounded-2xl border border-purple-200">
                  <span className="text-3xl mb-2 block">💼</span>
                  <h4 className="text-xl font-bold text-purple-950 mb-2">가족 팝업 프로젝트</h4>
                  <p className="text-gray-700">온 가족이 역할을 나누어(기획-아빠, 제작-아이들, 브랜딩-엄마) 작은 벼룩시장이나 온라인 굿즈 펀딩 해보기</p>
                </div>
                <div className="p-6 bg-sky-50 rounded-2xl border border-sky-200">
                  <span className="text-3xl mb-2 block">📚</span>
                  <h4 className="text-xl font-bold text-sky-950 mb-2">주말 가족 인문학 독서살롱</h4>
                  <p className="text-gray-700">한 달에 한 권 재미있는 과학·철학 책이나 명작 애니메이션을 함께 보고 맛있는 간식과 함께 생각 토론하기</p>
                </div>
                <div className="p-6 bg-emerald-50 rounded-2xl border border-emerald-200">
                  <span className="text-3xl mb-2 block">🎨</span>
                  <h4 className="text-xl font-bold text-emerald-950 mb-2">온 가족 협동 공예/목공</h4>
                  <p className="text-gray-700">우리 집 거실에 둘 작은 원목 테이블이나 가족 문패를 직접 목공소에서 함께 깎고 다듬어 만들기</p>
                </div>
                <div className="p-6 bg-rose-50 rounded-2xl border border-rose-200">
                  <span className="text-3xl mb-2 block">🗺️</span>
                  <h4 className="text-xl font-bold text-rose-950 mb-2">성찰과 치유의 제주 올레길 트레킹</h4>
                  <p className="text-gray-700">바다와 바람을 맞으며 휴대폰을 가방에 넣고, 네 사람이 나란히 걸으며 깊은 대화를 나누는 3박 4일 여정</p>
                </div>
              </div>
            </div>

            {/* 처음으로 돌아가기 버튼 */}
            <div className="text-center py-6">
              <button 
                onClick={() => setView('home')}
                className="py-4 px-8 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xl rounded-2xl shadow-lg transition-colors inline-flex items-center gap-3"
              >
                <span>처음 화면으로 돌아가기</span>
                <span>🏠</span>
              </button>
            </div>
          </div>
        );
      }

      return null;
    }

    // 렌더링
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
