<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARGO - 우리 가족 생애 재설계 가치관 나침반</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Pretendard Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <!-- 50개 심층 질문 & 6대 영역 데이터베이스 로드 -->
  <script src="questions-data.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #FDFBF7;
      font-family: 'Pretendard', sans-serif;
      color: #1F2937;
      word-break: keep-all;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 8px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #E5E7EB;
      border-radius: 4px;
    }
  </style>
</head>
<body class="min-h-screen bg-[#FDFBF7] text-gray-800 antialiased selection:bg-amber-100 selection:text-amber-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const FAMILY_MEMBERS = [
      { id: 'father', name: '아빠', age: 45, role: '휴직 중 (삶의 2막 설계)', avatar: '🐻', bgColor: 'bg-amber-50', borderColor: 'border-amber-300', badge: '쉼과 새로운 도약' },
      { id: 'mother', name: '엄마', age: 43, role: '이번 주 퇴직 (새로운 자아 탐색)', avatar: '🦊', bgColor: 'bg-rose-50', borderColor: 'border-rose-300', badge: '정체성의 확장' },
      { id: 'son', name: '아들', age: 12, role: '초등 5~6학년 (호기심 모험가)', avatar: '🐿️', bgColor: 'bg-sky-50', borderColor: 'border-sky-300', badge: '무한한 잠재력' },
      { id: 'daughter', name: '딸', age: 12, role: '초등 5~6학년 (창의적 예술가)', avatar: '🐰', bgColor: 'bg-emerald-50', borderColor: 'border-emerald-300', badge: '빛나는 감성과 표현' }
    ];

    function App() {
      // 뷰: 'home', 'solo_select', 'solo_play', 'solo_result', 'family_play', 'family_result'
      const [view, setView] = useState('home');
      
      // 질문 코스 설정: 10 (빠른 숏코스), 25 (심층 코스), 50 (50문항 마스터 코스)
      const [selectedCourseCount, setSelectedCourseCount] = useState(50);
      
      // 실제 진행할 질문 목록
      const activeQuestions = useMemo(() => {
        if (selectedCourseCount === 10) {
          // 각 테마(5개)별 2문항씩 균등 추출
          const sample = [];
          for (let i = 0; i < 5; i++) {
            sample.push(FIFTY_DILEMMAS[i * 10]);
            sample.push(FIFTY_DILEMMAS[i * 10 + 4]);
          }
          return sample;
        } else if (selectedCourseCount === 25) {
          // 각 테마별 5문항씩 추출
          const sample = [];
          for (let i = 0; i < 5; i++) {
            for (let j = 0; j < 5; j++) {
              sample.push(FIFTY_DILEMMAS[i * 10 + j]);
            }
          }
          return sample;
        }
        return FIFTY_DILEMMAS; // 50개 전체
      }, [selectedCourseCount]);

      // 솔로 모드 상태
      const [soloMember, setSoloMember] = useState(FAMILY_MEMBERS[0]);
      const [soloStep, setSoloStep] = useState(0);
      const [soloScores, setSoloScores] = useState({}); // { autonomy: 5, security: 3, ... }

      // 패밀리 릴레이 모드 상태
      const [familyRound, setFamilyRound] = useState(0);
      const [familyTurn, setFamilyTurn] = useState(0); // 0: 아빠, 1: 엄마, 2: 아들, 3: 딸
      const [familyAnswers, setFamilyAnswers] = useState({}); // { [qId]: { father: 'autonomy', ... } }
      const [familyScores, setFamilyScores] = useState({ father: {}, mother: {}, son: {}, daughter: {} });

      // 솔로 모드 시작
      const startSoloMode = (member) => {
        setSoloMember(member);
        setSoloStep(0);
        setSoloScores({});
        setView('solo_play');
      };

      // 솔로 답변 선택
      const handleSoloChoice = (valueKey) => {
        const nextScores = { ...soloScores, [valueKey]: (soloScores[valueKey] || 0) + 1 };
        setSoloScores(nextScores);

        if (soloStep + 1 < activeQuestions.length) {
          setSoloStep(soloStep + 1);
        } else {
          if (window.confetti) window.confetti({ particleCount: 100, spread: 80 });
          setView('solo_result');
        }
      };

      // 패밀리 릴레이 시작
      const startFamilyMode = () => {
        setFamilyRound(0);
        setFamilyTurn(0);
        setFamilyAnswers({});
        setFamilyScores({ father: {}, mother: {}, son: {}, daughter: {} });
        setView('family_play');
      };

      // 패밀리 릴레이 답변 선택
      const handleFamilyChoice = (valueKey) => {
        const currentQ = activeQuestions[familyRound];
        const currentM = FAMILY_MEMBERS[familyTurn];

        const roundData = familyAnswers[currentQ.id] || {};
        const updatedRound = {
          ...roundData,
          [currentM.id]: { valueKey, name: currentM.name, avatar: currentM.avatar }
        };
        const updatedFamilyAnswers = { ...familyAnswers, [currentQ.id]: updatedRound };
        setFamilyAnswers(updatedFamilyAnswers);

        // 점수 누적
        const memberScore = familyScores[currentM.id] || {};
        const updatedMemberScore = { ...memberScore, [valueKey]: (memberScore[valueKey] || 0) + 1 };
        setFamilyScores({ ...familyScores, [currentM.id]: updatedMemberScore });

        // 다음 턴 결정
        if (familyTurn + 1 < FAMILY_MEMBERS.length) {
          setFamilyTurn(familyTurn + 1);
        } else {
          // 라운드 종료
          if (familyRound + 1 < activeQuestions.length) {
            setFamilyRound(familyRound + 1);
            setFamilyTurn(0);
          } else {
            // 전체 종료
            if (window.confetti) window.confetti({ particleCount: 120, spread: 100 });
            setView('family_result');
          }
        }
      };

      // 최다 득표 핵심 가치 도출 헬퍼
      const getTopValue = (scores) => {
        const entries = Object.entries(scores);
        if (entries.length === 0) return 'autonomy';
        entries.sort((a, b) => b[1] - a[1]);
        return entries[0][0];
      };

      // ==========================================
      // VIEW 1: HOME (메인 화면)
      // ==========================================
      if (view === 'home') {
        return (
          <div className="max-w-5xl mx-auto px-6 py-12">
            <header className="text-center mb-10">
              <div className="flex flex-wrap items-center justify-center gap-3 mb-4">
                <span className="inline-flex items-center gap-2 px-4 py-2 bg-amber-100 text-amber-800 rounded-full text-base md:text-lg font-bold shadow-xs">
                  <span>🌟</span> 우리 가족 생애 재설계 가치관 나침반
                </span>
                <a 
                  href="mobile.html" 
                  className="inline-flex items-center gap-2 px-4 py-2 bg-indigo-100 hover:bg-indigo-200 text-indigo-800 rounded-full text-base md:text-lg font-bold shadow-xs transition-all"
                >
                  <span>📱</span> 스마트폰 모바일 앱 뷰로 열기 ➜
                </a>
              </div>
              <h1 className="text-3xl md:text-5xl font-black text-gray-900 tracking-tight leading-tight mb-4">
                가슴 뛰는 내면의 가치를 찾아 떠나는 <br className="hidden md:block"/>
                <span className="text-amber-600">온 가족 50대 심층 라이프 항해 (ARGO)</span>
              </h1>
              <p className="text-lg md:text-2xl text-gray-600 leading-relaxed max-w-3xl mx-auto">
                아빠의 쉼, 엄마의 새출발, 아이들의 무한한 성장! <br/>
                진짜 내 마음을 움직이는 <strong>핵심 가치관</strong>을 50개의 심층 질문으로 정밀하게 찾고, <br className="hidden md:block"/>
                <strong>직업 · 공부 · 취미 · 놀이 · 여행지 · 생활활동</strong> 6대 영역의 나침반을 세웁니다.
              </p>
            </header>

            {/* 가족 4인 프로필 배지 */}
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-10">
              {FAMILY_MEMBERS.map(m => (
                <div key={m.id} className={`${m.bgColor} border-2 ${m.borderColor} rounded-2xl p-4 text-center shadow-xs`}>
                  <div className="text-4xl md:text-5xl mb-2">{m.avatar}</div>
                  <div className="font-extrabold text-xl text-gray-900">{m.name} <span className="text-sm font-medium text-gray-500">({m.age}세)</span></div>
                  <div className="text-xs md:text-sm font-bold text-amber-700 mt-1">{m.badge}</div>
                  <div className="text-xs text-gray-500 mt-1 line-clamp-1">{m.role}</div>
                </div>
              ))}
            </div>

            {/* 질문 코스 선택 옵션 (10개 / 25개 / 50개) */}
            <div className="bg-white border-2 border-amber-200 rounded-3xl p-6 md:p-8 mb-10 shadow-sm">
              <div className="flex flex-col md:flex-row items-center justify-between gap-4 mb-4">
                <div>
                  <span className="text-xs font-bold text-amber-600 tracking-wider uppercase">QUESTION DEPTH SELECT</span>
                  <h3 className="text-xl md:text-2xl font-black text-gray-900 mt-1">오늘 진행할 질문 코스를 선택해 주세요</h3>
                </div>
                <div className="inline-block px-3 py-1 bg-amber-50 text-amber-800 text-sm font-extrabold rounded-lg border border-amber-200">
                  총 50개 심층 문항 데이터베이스 탑재
                </div>
              </div>
              <div className="grid md:grid-cols-3 gap-4">
                <button
                  onClick={() => setSelectedCourseCount(10)}
                  className={`p-5 rounded-2xl border-2 text-left transition-all ${
                    selectedCourseCount === 10 ? 'border-amber-500 bg-amber-50/80 shadow-md ring-2 ring-amber-400' : 'border-gray-200 hover:border-amber-300 bg-white'
                  }`}
                >
                  <div className="text-2xl mb-1">⚡</div>
                  <div className="font-extrabold text-lg text-gray-900">빠른 숏코스 (10문항)</div>
                  <p className="text-xs text-gray-500 mt-1">약 5분 소요 · 핵심 가치를 빠르게 스캔하고 싶을 때</p>
                </button>

                <button
                  onClick={() => setSelectedCourseCount(25)}
                  className={`p-5 rounded-2xl border-2 text-left transition-all ${
                    selectedCourseCount === 25 ? 'border-amber-500 bg-amber-50/80 shadow-md ring-2 ring-amber-400' : 'border-gray-200 hover:border-amber-300 bg-white'
                  }`}
                >
                  <div className="text-2xl mb-1">🎯</div>
                  <div className="font-extrabold text-lg text-gray-900">심층 코스 (25문항)</div>
                  <p className="text-xs text-gray-500 mt-1">약 15분 소요 · 테마별 균형 잡힌 정밀한 가치 분석</p>
                </button>

                <button
                  onClick={() => setSelectedCourseCount(50)}
                  className={`p-5 rounded-2xl border-2 text-left transition-all ${
                    selectedCourseCount === 50 ? 'border-amber-500 bg-amber-50/80 shadow-md ring-2 ring-amber-400' : 'border-gray-200 hover:border-amber-300 bg-white'
                  }`}
                >
                  <div className="text-2xl mb-1">🏆</div>
                  <div className="font-extrabold text-lg text-gray-900">마스터 항해 (50문항 전체)</div>
                  <p className="text-xs text-gray-500 mt-1">약 25분 소요 · 5대 테마를 완전히 완주하는 진정한 생애 성찰</p>
                </button>
              </div>
            </div>

            {/* 2대 진행 방식 대형 카드 */}
            <div className="grid md:grid-cols-2 gap-8 mb-10">
              {/* 솔로 모드 */}
              <div 
                onClick={() => setView('solo_select')}
                className="bg-white border-3 border-amber-200 hover:border-amber-500 rounded-3xl p-8 shadow-sm hover:shadow-xl transition-all cursor-pointer group flex flex-col justify-between"
              >
                <div>
                  <div className="w-16 h-16 rounded-2xl bg-amber-100 text-amber-700 flex items-center justify-center text-3xl mb-6 group-hover:scale-110 transition-transform">
                    🧘
                  </div>
                  <span className="px-3 py-1 bg-amber-50 text-amber-700 font-extrabold text-sm rounded-lg border border-amber-200">
                    방식 1. 차분하게 오롯이 나에게 집중
                  </span>
                  <h3 className="text-2xl md:text-3xl font-black text-gray-900 mt-3 mb-3">
                    한 명씩 진행하는 <br/>솔로 심층 모드
                  </h3>
                  <p className="text-base md:text-lg text-gray-600 leading-relaxed mb-6">
                    다른 사람 눈치 보지 않고, 조용한 시간에 오롯이 나의 내면을 마주합니다. {selectedCourseCount}개의 딜레마를 통해 나만의 6대 영역을 정밀하게 탐색합니다.
                  </p>
                </div>
                <button className="w-full py-4 px-6 bg-amber-500 hover:bg-amber-600 text-white font-extrabold text-lg md:text-xl rounded-2xl shadow-sm transition-colors flex items-center justify-center gap-2">
                  <span>솔로 모드 시작하기 ({selectedCourseCount}문항)</span>
                  <span>➜</span>
                </button>
              </div>

              {/* 패밀리 릴레이 모드 */}
              <div 
                onClick={startFamilyMode}
                className="bg-white border-3 border-indigo-200 hover:border-indigo-500 rounded-3xl p-8 shadow-sm hover:shadow-xl transition-all cursor-pointer group flex flex-col justify-between"
              >
                <div>
                  <div className="w-16 h-16 rounded-2xl bg-indigo-100 text-indigo-700 flex items-center justify-center text-3xl mb-6 group-hover:scale-110 transition-transform">
                    👨‍👩‍👧‍👦
                  </div>
                  <span className="px-3 py-1 bg-indigo-50 text-indigo-700 font-extrabold text-sm rounded-lg border border-indigo-200">
                    방식 2. 보드게임처럼 둘러앉아 대화
                  </span>
                  <h3 className="text-2xl md:text-3xl font-black text-gray-900 mt-3 mb-3">
                    네 명이 번갈아 하는 <br/>패밀리 릴레이 모드
                  </h3>
                  <p className="text-base md:text-lg text-gray-600 leading-relaxed mb-6">
                    식탁이나 거실에 모여 한 화면으로 턴을 넘기며 진행합니다! "아빠의 선택", "엄마의 마음", "아이들의 꿈"을 나누며 서로를 깊이 이해하는 축제의 시간입니다.
                  </p>
                </div>
                <button className="w-full py-4 px-6 bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-lg md:text-xl rounded-2xl shadow-sm transition-colors flex items-center justify-center gap-2">
                  <span>패밀리 릴레이 시작하기 ({selectedCourseCount}문항)</span>
                  <span>➜</span>
                </button>
              </div>
            </div>

            <div className="bg-amber-50/60 border border-amber-200 rounded-2xl p-6 text-center text-sm md:text-base text-gray-600">
              💡 <strong>추천 영역</strong>: 직업(Career), 공부(Study), 취미(Hobby), <strong>놀이(Play)</strong>, 여행지(Travel), 생활활동(Life Rituals) 6대 영역으로 대폭 확장되었습니다!
            </div>
          </div>
        );
      }

      // ==========================================
      // VIEW 2: SOLO SELECT (주인공 선택)
      // ==========================================
      if (view === 'solo_select') {
        return (
          <div className="max-w-3xl mx-auto px-6 py-12">
            <button 
              onClick={() => setView('home')} 
              className="text-gray-500 hover:text-gray-800 text-lg font-bold mb-6 flex items-center gap-2"
            >
              ← 메인으로 돌아가기
            </button>
            <div className="text-center mb-10">
              <span className="text-amber-600 font-extrabold text-lg tracking-wider">SOLO DEEP DIVE</span>
              <h2 className="text-3xl md:text-4xl font-black text-gray-900 mt-2 mb-3">
                오늘 깊은 사유의 여정을 떠날 주인공은 누구인가요?
              </h2>
              <p className="text-lg text-gray-600">
                선택하신 분의 생애주기(부모님의 커리어 2막 vs 아이들의 무한한 성장)에 맞춤화된 6대 영역 추천이 도출됩니다.
              </p>
            </div>

            <div className="grid md:grid-cols-2 gap-6">
              {FAMILY_MEMBERS.map(m => (
                <div 
                  key={m.id}
                  onClick={() => startSoloMode(m)}
                  className={`bg-white border-2 border-gray-200 hover:${m.borderColor} rounded-3xl p-6 shadow-sm hover:shadow-lg transition-all cursor-pointer flex items-center gap-5`}
                >
                  <div className={`w-20 h-20 rounded-2xl ${m.bgColor} flex items-center justify-center text-4xl shrink-0`}>
                    {m.avatar}
                  </div>
                  <div>
                    <div className="flex items-center gap-2 mb-1">
                      <span className="font-black text-2xl text-gray-900">{m.name}</span>
                      <span className="text-sm font-semibold text-gray-500">({m.age}세)</span>
                    </div>
                    <div className="text-sm font-bold text-amber-700 mb-2">{m.badge}</div>
                    <p className="text-sm text-gray-600">{m.role}</p>
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      }

      // ==========================================
      // VIEW 3: SOLO PLAY (솔로 진행)
      // ==========================================
      if (view === 'solo_play') {
        const currentQ = activeQuestions[soloStep];
        const currentTheme = THEMES.find(t => t.id === currentQ.themeId);

        return (
          <div className="max-w-3xl mx-auto px-6 py-12">
            {/* 상단 프로필 및 진행률 바 */}
            <div className="flex items-center justify-between mb-6 pb-4 border-b border-gray-200">
              <div className="flex items-center gap-3">
                <span className="text-4xl">{soloMember.avatar}</span>
                <div>
                  <div className="font-black text-xl text-gray-900">{soloMember.name}의 가치관 탐험</div>
                  <div className="text-xs font-bold text-amber-700">{currentTheme?.name}</div>
                </div>
              </div>
              <div className="text-right">
                <span className="text-sm font-black text-amber-600">{soloStep + 1} / {activeQuestions.length}</span>
                <div className="w-36 h-3 bg-gray-200 rounded-full mt-1.5 overflow-hidden">
                  <div 
                    className="h-full bg-amber-500 transition-all duration-300"
                    style={{ width: `${((soloStep + 1) / activeQuestions.length) * 100}%` }}
                  ></div>
                </div>
              </div>
            </div>

            {/* 질문 카드 */}
            <div className="bg-white border-2 border-amber-200 rounded-3xl p-8 md:p-10 shadow-lg mb-8">
              <span className="px-3 py-1 bg-amber-100 text-amber-900 rounded-full text-xs font-black uppercase tracking-wider">
                Q{soloStep + 1}. {currentQ.title}
              </span>
              <h2 className="text-2xl md:text-3xl font-black text-gray-900 leading-snug mt-3 mb-6">
                {currentQ.question}
              </h2>

              {/* 양자택일 선택 카드 (큰 폰트와 쾌적한 줄간격) */}
              <div className="space-y-5">
                <button
                  onClick={() => handleSoloChoice(currentQ.optionA.valueKey)}
                  className="w-full text-left p-6 md:p-8 bg-amber-50/60 hover:bg-amber-100/90 border-2 border-amber-200 hover:border-amber-400 rounded-2xl transition-all shadow-xs hover:shadow-md group flex items-start gap-4"
                >
                  <span className="text-4xl shrink-0 group-hover:scale-110 transition-transform">
                    {currentQ.optionA.emoji}
                  </span>
                  <div>
                    <div className="text-xl md:text-2xl font-black text-gray-900 mb-2">
                      {currentQ.optionA.title}
                    </div>
                    <div className="text-base md:text-lg text-gray-700 leading-relaxed font-medium">
                      {currentQ.optionA.desc}
                    </div>
                  </div>
                </button>

                <button
                  onClick={() => handleSoloChoice(currentQ.optionB.valueKey)}
