<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARGO - 우리 가족 생애 재설계 가치관 나침반</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Pretendard Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <!-- 50개 4지선다형 심층 질문 & 6대 영역 데이터베이스 로드 -->
  <script src="questions-data.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #FDFBF7;
      font-family: 'Pretendard', sans-serif;
      color: #1F2937;
      word-break: keep-all;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 8px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #E5E7EB;
      border-radius: 4px;
    }
  </style>
</head>
<body class="min-h-screen bg-[#FDFBF7] text-gray-800 antialiased selection:bg-amber-100 selection:text-amber-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const FAMILY_MEMBERS = [
      { id: 'father', name: '아빠', age: 45, role: '휴직 중 (삶의 2막 설계)', avatar: '🐻', bgColor: 'bg-amber-50', borderColor: 'border-amber-300', badge: '쉼과 새로운 도약' },
      { id: 'mother', name: '엄마', age: 43, role: '이번 주 퇴직 (새로운 자아 탐색)', avatar: '🦊', bgColor: 'bg-rose-50', borderColor: 'border-rose-300', badge: '정체성의 확장' },
      { id: 'son', name: '아들', age: 12, role: '초등 5~6학년 (호기심 모험가)', avatar: '🐿️', bgColor: 'bg-sky-50', borderColor: 'border-sky-300', badge: '무한한 잠재력' },
      { id: 'daughter', name: '딸', age: 12, role: '초등 5~6학년 (창의적 예술가)', avatar: '🐰', bgColor: 'bg-emerald-50', borderColor: 'border-emerald-300', badge: '빛나는 감성과 표현' }
    ];

    function App() {
      const [view, setView] = useState('home');
      const [selectedCourseCount, setSelectedCourseCount] = useState(50);

      // 로컬 스토리지에 저장된 평가 이력 목록
      const [savedHistory, setSavedHistory] = useState([]);
      // 현재 조회 중인 저장된 결과 객체 (이력 보기 클릭 시)
      const [viewingRecord, setViewingRecord] = useState(null);

      // 로컬 스토리지 이력 불러오기
      useEffect(() => {
        try {
          const raw = localStorage.getItem('argo_family_history');
          if (raw) {
            setSavedHistory(JSON.parse(raw));
          }
        } catch (e) {
          console.error("이력 불러오기 실패:", e);
        }
      }, []);

      // 활성화된 질문 목록 (10, 25, 50)
      const activeQuestions = useMemo(() => {
        if (selectedCourseCount === 10) {
          const sample = [];
          for (let i = 0; i < 5; i++) {
            sample.push(FIFTY_DILEMMAS[i * 10]);
            sample.push(FIFTY_DILEMMAS[i * 10 + 4]);
          }
          return sample;
        } else if (selectedCourseCount === 25) {
          const sample = [];
          for (let i = 0; i < 5; i++) {
            for (let j = 0; j < 5; j++) {
              sample.push(FIFTY_DILEMMAS[i * 10 + j]);
            }
          }
          return sample;
        }
        return FIFTY_DILEMMAS;
      }, [selectedCourseCount]);

      // 솔로 모드 상태
      const [soloMember, setSoloMember] = useState(FAMILY_MEMBERS[0]);
      const [soloStep, setSoloStep] = useState(0);
      const [soloScores, setSoloScores] = useState({});
      const [soloHistory, setSoloHistory] = useState([]); // [{ step, valueKey }]

      // 패밀리 릴레이 모드 상태
      const [familyRound, setFamilyRound] = useState(0);
      const [familyTurn, setFamilyTurn] = useState(0);
      const [familyAnswers, setFamilyAnswers] = useState({});
      const [familyScores, setFamilyScores] = useState({ father: {}, mother: {}, son: {}, daughter: {} });
      const [familyHistory, setFamilyHistory] = useState([]);

      // 최다 득표 핵심 가치 도출 헬퍼
      const getTopValue = (scores) => {
        const entries = Object.entries(scores || {});
        if (entries.length === 0) return 'autonomy';
        entries.sort((a, b) => b[1] - a[1]);
        return entries[0][0];
      };

      // 결과 저장 헬퍼
      const saveRecord = (recordData) => {
        try {
          const updated = [recordData, ...savedHistory.slice(0, 29)]; // 최대 30개 보관
          setSavedHistory(updated);
          localStorage.setItem('argo_family_history', JSON.stringify(updated));
        } catch (e) {
          console.error("저장 실패:", e);
        }
      };

      // 이력 삭제
      const deleteRecord = (id, e) => {
        e.stopPropagation();
        const updated = savedHistory.filter(h => h.id !== id);
        setSavedHistory(updated);
        localStorage.setItem('argo_family_history', JSON.stringify(updated));
      };

      // 솔로 모드 시작
      const startSoloMode = (member) => {
        setSoloMember(member);
        setSoloStep(0);
        setSoloScores({});
        setSoloHistory([]);
        setViewingRecord(null);
        setView('solo_play');
      };

      // 솔로 4지선다 답변 선택
      const handleSoloChoice = (valueKey) => {
        const nextScores = { ...soloScores, [valueKey]: (soloScores[valueKey] || 0) + 1 };
        setSoloScores(nextScores);
        setSoloHistory([...soloHistory, { step: soloStep, valueKey }]);

        if (soloStep + 1 < activeQuestions.length) {
          setSoloStep(soloStep + 1);
        } else {
          // 완료! 결과 저장
          const topKey = getTopValue(nextScores);
          const newRecord = {
            id: 'solo_' + Date.now(),
            type: 'solo',
            date: new Date().toLocaleString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
            member: soloMember,
            courseCount: selectedCourseCount,
            topKey,
            scores: nextScores
          };
          saveRecord(newRecord);

          if (window.confetti) window.confetti({ particleCount: 100, spread: 80 });
          setViewingRecord(null);
          setView('solo_result');
        }
      };

      // 솔로 이전 질문 되돌리기
      const handleSoloPrev = () => {
        if (soloStep === 0 || soloHistory.length === 0) return;
        const lastEntry = soloHistory[soloHistory.length - 1];
        const updatedHistory = soloHistory.slice(0, -1);
        
        const prevKey = lastEntry.valueKey;
        const updatedScores = { ...soloScores };
        if (updatedScores[prevKey] > 0) {
          updatedScores[prevKey] -= 1;
        }

        setSoloScores(updatedScores);
        setSoloHistory(updatedHistory);
        setSoloStep(soloStep - 1);
      };

      // 패밀리 릴레이 시작
      const startFamilyMode = () => {
        setFamilyRound(0);
        setFamilyTurn(0);
        setFamilyAnswers({});
        setFamilyScores({ father: {}, mother: {}, son: {}, daughter: {} });
        setFamilyHistory([]);
        setViewingRecord(null);
        setView('family_play');
      };

      // 패밀리 4지선다 답변 선택
      const handleFamilyChoice = (valueKey) => {
        const currentQ = activeQuestions[familyRound];
        const currentM = FAMILY_MEMBERS[familyTurn];

        const roundData = familyAnswers[currentQ.id] || {};
        const updatedRound = {
          ...roundData,
          [currentM.id]: { valueKey, name: currentM.name, avatar: currentM.avatar }
        };
        const updatedFamilyAnswers = { ...familyAnswers, [currentQ.id]: updatedRound };
        setFamilyAnswers(updatedFamilyAnswers);

        const memberScore = familyScores[currentM.id] || {};
        const updatedMemberScore = { ...memberScore, [valueKey]: (memberScore[valueKey] || 0) + 1 };
        const nextScores = { ...familyScores, [currentM.id]: updatedMemberScore };
        setFamilyScores(nextScores);

        setFamilyHistory([...familyHistory, {
          round: familyRound,
          turn: familyTurn,
          memberId: currentM.id,
          questionId: currentQ.id,
          valueKey
        }]);

        if (familyTurn + 1 < FAMILY_MEMBERS.length) {
          setFamilyTurn(familyTurn + 1);
        } else {
          if (familyRound + 1 < activeQuestions.length) {
            setFamilyRound(familyRound + 1);
            setFamilyTurn(0);
          } else {
            // 패밀리 완료! 결과 저장
            const familySummary = {};
            FAMILY_MEMBERS.forEach(m => {
              familySummary[m.id] = getTopValue(nextScores[m.id]);
            });

            const newRecord = {
              id: 'family_' + Date.now(),
              type: 'family',
              date: new Date().toLocaleString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
              courseCount: selectedCourseCount,
              familyScores: nextScores,
              familySummary
            };
            saveRecord(newRecord);

            if (window.confetti) window.confetti({ particleCount: 120, spread: 100 });
            setViewingRecord(null);
            setView('family_result');
          }
        }
      };

      // 패밀리 이전 턴 되돌리기
      const handleFamilyPrev = () => {
        if (familyHistory.length === 0) return;
        const lastEntry = familyHistory[familyHistory.length - 1];
        const updatedHistory = familyHistory.slice(0, -1);

        const { memberId, questionId, valueKey, round, turn } = lastEntry;
        const memberScore = { ...familyScores[memberId] };
        if (memberScore[valueKey] > 0) {
          memberScore[valueKey] -= 1;
        }
        setFamilyScores({ ...familyScores, [memberId]: memberScore });

        const updatedAnswers = { ...familyAnswers };
        if (updatedAnswers[questionId] && updatedAnswers[questionId][memberId]) {
          delete updatedAnswers[questionId][memberId];
        }
        setFamilyAnswers(updatedAnswers);

        setFamilyHistory(updatedHistory);
        setFamilyRound(round);
        setFamilyTurn(turn);
      };

      // 저장된 이력 클릭하여 결과 다시보기
      const openHistoryRecord = (record) => {
        setViewingRecord(record);
        if (record.type === 'solo') {
          setSoloMember(record.member);
          setSoloScores(record.scores);
          setView('solo_result');
        } else {
          setFamilyScores(record.familyScores);
          setView('family_result');
        }
      };

      // ==========================================
      // VIEW 1: HOME (메인 화면)
      // ==========================================
      if (view === 'home') {
        return (
          <div className="max-w-5xl mx-auto px-6 py-12">
            <header className="text-center mb-10">
              <div className="flex flex-wrap items-center justify-center gap-3 mb-4">
                <span className="inline-flex items-center gap-2 px-4 py-2 bg-amber-100 text-amber-800 rounded-full text-base md:text-lg font-bold shadow-xs">
                  <span>🌟</span> 우리 가족 생애 재설계 가치관 나침반
                </span>
                <a 
                  href="mobile.html" 
                  className="inline-flex items-center gap-2 px-4 py-2 bg-indigo-100 hover:bg-indigo-200 text-indigo-800 rounded-full text-base md:text-lg font-bold shadow-xs transition-all"
                >
                  <span>📱</span> 스마트폰 모바일 앱 뷰로 열기 ➜
                </a>
              </div>
              <h1 className="text-3xl md:text-5xl font-black text-gray-900 tracking-tight leading-tight mb-4">
                가슴 뛰는 내면의 가치를 찾아 떠나는 <br className="hidden md:block"/>
                <span className="text-amber-600">온 가족 50대 심층 라이프 항해 (ARGO)</span>
              </h1>
              <p className="text-lg md:text-2xl text-gray-600 leading-relaxed max-w-3xl mx-auto">
                아빠의 쉼, 엄마의 새출발, 아이들의 무한한 성장! <br/>
                진짜 내 마음을 움직이는 <strong>핵심 가치관</strong>을 50개의 생생한 4지선다형 상황 질문으로 정밀하게 찾고, <br className="hidden md:block"/>
                <strong>직업 · 공부 · 취미 · 놀이 · 여행지 · 생활활동</strong> 6대 영역의 구체적 경로를 만납니다.
              </p>
            </header>

            {/* 가족 4인 프로필 배지 */}
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-10">
              {FAMILY_MEMBERS.map(m => (
                <div key={m.id} className={`${m.bgColor} border-2 ${m.borderColor} rounded-2xl p-4 text-center shadow-xs`}>
                  <div className="text-4xl md:text-5xl mb-2">{m.avatar}</div>
                  <div className="font-extrabold text-xl text-gray-900">{m.name} <span className="text-sm font-medium text-gray-500">({m.age}세)</span></div>
                  <div className="text-xs md:text-sm font-bold text-amber-700 mt-1">{m.badge}</div>
                  <div className="text-xs text-gray-500 mt-1 line-clamp-1">{m.role}</div>
                </div>
              ))}
            </div>

            {/* 저장된 가치관 진단 이력 보관소 */}
            {savedHistory.length > 0 && (
              <div className="bg-white border-2 border-indigo-200 rounded-3xl p-6 md:p-8 mb-10 shadow-sm">
                <div className="flex items-center justify-between mb-4">
                  <div className="flex items-center gap-2">
                    <span className="text-2xl">📜</span>
                    <h3 className="text-xl md:text-2xl font-black text-gray-900">저장된 가치관 진단 기록 보관소</h3>
                  </div>
                  <span className="text-xs font-bold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full border border-indigo-200">
                    총 {savedHistory.length}개의 기록
                  </span>
                </div>
                <p className="text-sm text-gray-500 mb-4">
                  이전에 진단했던 결과를 클릭하시면 언제든 6대 영역 추천서와 상세 평가 화면을 다시 열람할 수 있습니다.
                </p>
                <div className="grid md:grid-cols-2 gap-3 max-h-60 overflow-y-auto pr-2 custom-scroll">
                  {savedHistory.map((rec) => {
                    const topData = SIX_DIMENSIONS_RECOMMENDATIONS[rec.topKey] || SIX_DIMENSIONS_RECOMMENDATIONS.autonomy;
                    return (
                      <div
                        key={rec.id}
                        onClick={() => openHistoryRecord(rec)}
                        className="p-4 bg-gray-50 hover:bg-indigo-50/70 border border-gray-200 hover:border-indigo-300 rounded-2xl cursor-pointer transition-all flex items-center justify-between group shadow-2xs"
                      >
                        <div className="flex items-center gap-3">
                          <span className="text-3xl">{rec.type === 'solo' ? rec.member?.avatar : '👨‍👩‍👧‍👦'}</span>
                          <div>
                            <div className="font-black text-base text-gray-900">
                              {rec.type === 'solo' ? `${rec.member?.name}의 나침반` : '온 가족 릴레이 결과'}
                              <span className="ml-2 text-xs font-bold text-amber-700 bg-amber-100 px-2 py-0.5 rounded-full">
                                {rec.type === 'solo' ? topData.name.split(' ')[0] : '가족 헌장'}
                              </span>
                            </div>
                            <div className="text-xs text-gray-400 mt-0.5">
                              {rec.date} · {rec.courseCount}문항 완주
                            </div>
                          </div>
                        </div>
                        <div className="flex items-center gap-2">
                          <span className="text-xs font-bold text-indigo-600 opacity-0 group-hover:opacity-100 transition-opacity">
                            결과 보기 ➜
                          </span>
                          <button
                            onClick={(e) => deleteRecord(rec.id, e)}
                            className="text-gray-300 hover:text-red-500 text-sm px-2 py-1 rounded hover:bg-white"
                            title="기록 삭제"
                          >
                            ✕
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* 질문 코스 선택 */}
            <div className="bg-white border-2 border-amber-200 rounded-3xl p-6 md:p-8 mb-10 shadow-sm">
              <div className="flex flex-col md:flex-row items-center justify-between gap-4 mb-4">
                <div>
                  <span className="text-xs font-bold text-amber-600 tracking-wider uppercase">QUESTION DEPTH SELECT</span>
                  <h3 className="text-xl md:text-2xl font-black text-gray-900 mt-1">오늘 진행할 질문 코스를 선택해 주세요</h3>
                </div>
                <div className="inline-block px-3 py-1 bg-amber-50 text-amber-800 text-sm font-extrabold rounded-lg border border-amber-200">
                  모든 문항 4지선다형 · 자동 저장 지원
                </div>
              </div>
              <div className="grid md:grid-cols-3 gap-4">
                <button
                  onClick={() => setSelectedCourseCount(10)}
                  className={`p-5 rounded-2xl border-2 text-left transition-all ${
                    selectedCourseCount === 10 ? 'border-amber-500 bg-amber-50/80 shadow-md ring-2 ring-amber-400' : 'border-gray-200 hover:border-amber-300 bg-white'
                  }`}
                >
                  <div className="text-2xl mb-1">⚡</div>
                  <div className="font-extrabold text-lg text-gray-900">빠른 숏코스 (10문항)</div>
                  <p className="text-xs text-gray-500 mt-1">약 5분 소요 · 핵심 가치를 빠르게 스캔하고 싶을 때</p>
                </button>

                <button
                  onClick={() => setSelectedCourseCount(25)}
                  className={`p-5 rounded-2xl border-2 text-left transition-all ${
                    selectedCourseCount === 25 ? 'border-amber-500 bg-amber-50/80 shadow-md ring-2 ring-amber-400' : 'border-gray-200 hover:border-amber-300 bg-white'
                  }`}
                >
                  <div className="text-2xl mb-1">🎯</div>
                  <div className="font-extrabold text-lg text-gray-900">심층 코스 (25문항)</div>
                  <p className="text-xs text-gray-500 mt-1">약 15분 소요 · 테마별 균형 잡힌 정밀한 가치 분석</p>
                </button>

                <button
                  onClick={() => setSelectedCourseCount(50)}
                  className={`p-5 rounded-2xl border-2 text-left transition-all ${
                    selectedCourseCount === 50 ? 'border-amber-500 bg-amber-50/80 shadow-md ring-2 ring-amber-400' : 'border-gray-200 hover:border-amber-300 bg-white'
                  }`}
                >
                  <div className="text-2xl mb-1">🏆</div>
                  <div className="font-extrabold text-lg text-gray-900">마스터 항해 (50문항 전체)</div>
                  <p className="text-xs text-gray-500 mt-1">약 25분 소요 · 5대 테마를 완전히 완주하는 진정한 생애 성찰</p>
                </button>
              </div>
            </div>

            {/* 2대 진행 방식 대형 카드 */}
            <div className="grid md:grid-cols-2 gap-8 mb-10">
              <div 
                onClick={() => setView('solo_select')}
                className="bg-white border-3 border-amber-200 hover:border-amber-500 rounded-3xl p-8 shadow-sm hover:shadow-xl transition-all cursor-pointer group flex flex-col justify-between"
              >
                <div>
                  <div className="w-16 h-16 rounded-2xl bg-amber-100 text-amber-700 flex items-center justify-center text-3xl mb-6 group-hover:scale-110 transition-transform">
                    🧘
                  </div>
                  <span className="px-3 py-1 bg-amber-50 text-amber-700 font-extrabold text-sm rounded-lg border border-amber-200">
                    방식 1. 차분하게 오롯이 나에게 집중
                  </span>
                  <h3 className="text-2xl md:text-3xl font-black text-gray-900 mt-3 mb-3">
                    한 명씩 진행하는 <br/>솔로 심층 모드
                  </h3>
                  <p className="text-base md:text-lg text-gray-600 leading-relaxed mb-6">
                    다른 사람 눈치 보지 않고, 4개의 다양한 선택지 중에서 내 마음에 가장 가까운 답을 고릅니다. 완료 시 결과가 자동으로 보관소에 저장됩니다.
                  </p>
                </div>
                <button className="w-full py-4 px-6 bg-amber-500 hover:bg-amber-600 text-white font-extrabold text-lg md:text-xl rounded-2xl shadow-sm transition-colors flex items-center justify-center gap-2">
                  <span>솔로 모드 시작하기 ({selectedCourseCount}문항)</span>
                  <span>➜</span>
                </button>
              </div>

              <div 
                onClick={startFamilyMode}
                className="bg-white border-3 border-indigo-200 hover:border-indigo-500 rounded-3xl p-8 shadow-sm hover:shadow-xl transition-all cursor-pointer group flex flex-col justify-between"
              >
                <div>
                  <div className="w-16 h-16 rounded-2xl bg-indigo-100 text-indigo-700 flex items-center justify-center text-3xl mb-6 group-hover:scale-110 transition-transform">
                    👨‍👩‍👧‍👦
                  </div>

                    className="px-3 py-2 bg-indigo-800 hover:bg-indigo-700 text-indigo-100 rounded-xl text-xs font-black transition-all flex items-center gap-1 border border-indigo-600 shadow-2xs"
                  >
                    <span>↺ 이전 턴</span>
                  </button>
                )}
              </div>
            </div>

            {/* 공통 딜레마 카드 */}
            <div className="bg-white border-2 border-indigo-200 rounded-3xl p-8 md:p-10 shadow-lg mb-6">
              <div className="flex items-center justify-between mb-2">
                <span className="text-xs font-bold text-indigo-600 uppercase tracking-wider">
                  Q{familyRound + 1}. {currentQ.title}
                </span>
                {familyHistory.length > 0 && (
                  <button
                    onClick={handleFamilyPrev}
                    className="text-xs font-black text-gray-500 hover:text-indigo-600 flex items-center gap-1"
                  >
                    <span>↺ 이전 가족 턴으로</span>
                  </button>
                )}
              </div>

              <h3 className="text-2xl md:text-3xl font-black text-gray-900 leading-snug mt-1 mb-4">
                {currentQ.question}
              </h3>
              
              <div className="p-4 bg-indigo-50 border border-indigo-200 rounded-2xl text-indigo-950 font-bold text-base md:text-lg mb-8 leading-relaxed">
                {currentQ.familyTopic}
              </div>

              {/* 4지선다형 버튼 4개 */}
              <div className="grid md:grid-cols-2 gap-4">
                {currentQ.options.map((opt, idx) => (
                  <button
                    key={idx}
                    onClick={() => handleFamilyChoice(opt.valueKey)}
                    className="p-6 text-left bg-indigo-50/40 hover:bg-indigo-100/80 border-2 border-indigo-200 hover:border-indigo-500 rounded-2xl transition-all shadow-2xs hover:shadow-md group flex flex-col justify-between"
                  >
                    <div>
                      <div className="w-8 h-8 rounded-xl bg-indigo-600 text-white font-black flex items-center justify-center text-sm mb-3 group-hover:scale-110 transition-transform">
                        {optionLabels[idx]}
                      </div>
                      <div className="text-base md:text-lg text-gray-800 leading-relaxed font-bold mb-2">
                        {opt.text}
                      </div>
                    </div>
                    <div className="mt-4 pt-3 border-t border-indigo-100 text-xs font-extrabold text-indigo-700 flex items-center justify-between">
                      <span>{opt.desc}</span>
                      <span>{currentM.name}의 선택 ➜</span>
                    </div>
                  </button>
                ))}
              </div>
            </div>

            {/* 하단 되돌리기 */}
            <div className="flex items-center justify-between text-sm text-gray-500 px-2 mb-6">
              {familyHistory.length > 0 ? (
                <button
                  onClick={handleFamilyPrev}
                  className="text-indigo-700 hover:text-indigo-900 font-bold flex items-center gap-1.5 py-1.5 px-3 rounded-lg hover:bg-indigo-50 transition-colors"
                >
                  <span>←</span> <span>이전 가족 턴으로 돌아가서 다시 선택하기</span>
                </button>
              ) : (
                <span className="text-gray-400">첫 번째 턴입니다.</span>
              )}
              <span className="text-gray-400 text-xs">잘못 눌렀을 때는 언제든 이전 턴으로 돌아갈 수 있어요.</span>
            </div>

            {/* 이번 라운드 실시간 선택 현황 */}
            <div className="bg-gray-50 border border-gray-200 rounded-2xl p-6">
              <h4 className="font-extrabold text-lg text-gray-800 mb-4 flex items-center gap-2">
                <span>👀</span> 이 질문에 대한 우리 가족의 실시간 선택
              </h4>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                {FAMILY_MEMBERS.map(m => {
                  const ans = currentRoundAnswers[m.id];
                  const ansData = ans ? SIX_DIMENSIONS_RECOMMENDATIONS[ans.valueKey] : null;
                  return (
                    <div key={m.id} className="p-4 bg-white rounded-xl border border-gray-200 text-center shadow-2xs">
                      <div className="text-3xl mb-1">{m.avatar}</div>
                      <div className="font-black text-gray-900">{m.name}</div>
                      <div className="text-xs font-black text-indigo-600 mt-1">
                        {ansData ? ansData.name.split(' ')[0] : '생각 중... 💭'}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        );
      }

      // ==========================================
      // VIEW 6: FAMILY RESULT (패밀리 결과)
      // ==========================================
      if (view === 'family_result') {
        const currentScores = viewingRecord?.familyScores || familyScores;

        return (
          <div className="max-w-4xl mx-auto px-6 py-12">
            <button 
              onClick={() => setView('home')} 
              className="text-gray-500 hover:text-gray-800 text-lg font-bold mb-6 flex items-center gap-2"
            >
              ← 메인으로 돌아가기
            </button>

            <div className="bg-gradient-to-r from-indigo-700 via-purple-700 to-pink-600 text-white rounded-3xl p-8 md:p-12 shadow-2xl mb-10 text-center">
              <div className="flex justify-center gap-3 text-5xl md:text-6xl mb-4">
                <span>🐻</span><span>🦊</span><span>🐿️</span><span>🐰</span>
              </div>
              <span className="px-4 py-1.5 bg-white/20 rounded-full font-black text-sm tracking-wider uppercase">
                {viewingRecord ? `${viewingRecord.date} 기록 조회` : `${selectedCourseCount}문항 완주`} · FAMILY SYNERGY COMPASS
              </span>
              <h2 className="text-3xl md:text-5xl font-black mt-4 mb-4">
                우리 가족 가치관 나침반 & 삶의 헌장 완성!
              </h2>
              <p className="text-lg md:text-xl text-purple-100 max-w-2xl mx-auto leading-relaxed">
                서로의 다른 가치를 확인하고, 깊이 공감한 이 시간이야말로 <br/>
                새로운 인생 2막을 여는 가장 든든한 밑거름입니다. (보관소에 자동 저장 완료)
              </p>
            </div>

            {/* 4인 4색 핵심 닻 요약 */}
            <div className="bg-white border-2 border-indigo-200 rounded-3xl p-8 shadow-sm mb-12">
              <h3 className="text-2xl font-black text-gray-900 mb-6 flex items-center gap-2">
                <span>🧭</span> 4인 4색: 우리 가족의 핵심 가치관 분석
              </h3>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                {FAMILY_MEMBERS.map(m => {
                  const mTopKey = getTopValue(currentScores[m.id]);
                  const mTopData = SIX_DIMENSIONS_RECOMMENDATIONS[mTopKey] || SIX_DIMENSIONS_RECOMMENDATIONS.autonomy;
                  return (
                    <div key={m.id} className="p-5 bg-indigo-50/60 rounded-2xl border border-indigo-200 text-center">
                      <div className="text-4xl mb-2">{m.avatar}</div>
                      <div className="font-black text-xl text-gray-900">{m.name}</div>
                      <div className="text-sm font-black text-indigo-700 mt-2 px-3 py-1 bg-white rounded-full border border-indigo-200">
                        {mTopData.name.split(' ')[0]}
                      </div>
                      <div className="text-xs text-gray-500 mt-2 line-clamp-2">
                        {mTopData.badge}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* 우리 가족 삶의 헌장 */}
            <div className="bg-amber-50 border-3 border-amber-300 rounded-3xl p-8 md:p-10 shadow-sm mb-12">
              <div className="text-center mb-6">
                <span className="text-4xl">📜</span>
                <h3 className="text-2xl md:text-3xl font-black text-amber-950 mt-2">
                  우리가 함께 세운 「우리 가족 삶의 헌장」
                </h3>
              </div>
              <div className="space-y-4 max-w-2xl mx-auto text-lg md:text-xl text-gray-800 leading-relaxed font-medium">
                <div className="p-4 bg-white/90 rounded-2xl shadow-2xs border border-amber-200 flex items-start gap-3">
                  <span className="text-amber-700 font-bold text-2xl">1.</span>
                  <span><strong>각자의 속도와 자유를 존중합니다:</strong> 아빠의 쉼, 엄마의 새출발, 아이들의 성장을 재촉하지 않고 온전히 지지합니다.</span>
                </div>
                <div className="p-4 bg-white/90 rounded-2xl shadow-2xs border border-amber-200 flex items-start gap-3">
                  <span className="text-amber-700 font-bold text-2xl">2.</span>
                  <span><strong>두근거리는 도전을 격려합니다:</strong> 실패를 두려워하지 않고, 새로운 취미·공부·놀이의 호기심을 활짝 열어줍니다.</span>
                </div>
                <div className="p-4 bg-white/90 rounded-2xl shadow-2xs border border-amber-200 flex items-start gap-3">
                  <span className="text-amber-700 font-bold text-2xl">3.</span>
                  <span><strong>매일 15분 마음을 나눕니다:</strong> 저녁 식탁에서 오늘 감사했던 일과 호기심을 나누며 서로의 가장 따뜻한 울타리가 되어줍니다.</span>
                </div>
              </div>
            </div>

            <div className="text-center py-6">
              <button 
                onClick={() => setView('home')}
                className="py-4 px-8 bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-xl rounded-2xl shadow-lg transition-colors inline-flex items-center gap-3"
              >
                <span>메인 화면으로 돌아가기</span>
                <span>🏠</span>
              </button>
            </div>
          </div>
        );
      }

      return null;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
